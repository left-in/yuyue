<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置六种</title>
<style>
/* 颜色、字号都取自现在的 App：apple/Yuyue/Design/Tokens.swift 和书架窗口（MacShelfView.swift 的 ShelfDesk） */
:root{--bg:#F6F5F3;--card:#FFFFFF;--inset:#EFEEEB;--line:#E7E5E1;--t1:#2A2B2E;--t2:#6E6B68;--t3:#8A8682;--accent:#2B4C7E;--accent-soft:rgba(43,76,126,.1);
  --desk:#EAE8E3;--wash:rgba(42,43,46,.07);--field:rgba(0,0,0,.05);--zsh:0 0 0 .5px rgba(0,0,0,.07),0 1px 2px rgba(51,46,41,.04),0 8px 24px rgba(51,46,41,.05);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;--serif:"Songti SC","Noto Serif SC","STSong",serif;--e:cubic-bezier(.2,0,0,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101112;--card:#1B1C1E;--inset:#26272A;--line:#2C2D30;--t1:#EDEDEE;--t2:#9A9895;--t3:#8E8C89;--accent:#8FA8C8;--accent-soft:rgba(143,168,200,.16);
  --desk:#0C0C0D;--wash:rgba(255,255,255,.08);--field:rgba(255,255,255,.06);--zsh:0 0 0 .5px rgba(255,255,255,.06);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:color-mix(in srgb,var(--bg) 70%,#d9d6cf);font-family:var(--sans);color:var(--t1);-webkit-font-smoothing:antialiased}
@media (prefers-color-scheme:dark){body{background:#050506}}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 20px 110px}
.cap{max-width:860px;text-align:center;font-size:13px;line-height:1.7;color:var(--t2)}
.cap b{color:var(--t1)}
/* 窗口 */
.win{position:relative;overflow:hidden;border-radius:12px;background:var(--bg);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 30px 70px rgba(51,46,41,.18);font-size:13px}
.lights{position:absolute;left:16px;top:16px;display:flex;gap:8px;z-index:5}
.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* 通用控件：和 App 一样的开关、分段、滑杆、按钮 */
.tg{position:relative;width:30px;height:18px;border-radius:9px;background:var(--inset);box-shadow:inset 0 0 0 .5px var(--line);flex:none;cursor:pointer;transition:background-color .2s}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--e)}
.tg.on{background:var(--accent);box-shadow:none}.tg.on::after{transform:translateX(12px)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--inset);flex:none}
.seg button{height:22px;padding:0 10px;border:0;border-radius:6px;background:none;font:11.5px var(--sans);color:var(--t2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--t1);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px var(--line)}
.sl{display:flex;align-items:center;gap:10px;flex:none}
.sl input{width:150px;accent-color:var(--accent)}
.sl b{min-width:34px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.btn{height:24px;padding:0 11px;border:0;border-radius:12px;background:var(--inset);font:500 11.5px var(--sans);color:var(--t1);cursor:pointer;white-space:nowrap;flex:none}
.btn.k{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.k{color:#101214}}
.btn:active{transform:scale(.96)}
.pp{display:flex;gap:8px;flex:none}
.pp span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--t2);cursor:pointer}
.pp i{width:34px;height:26px;border-radius:6px;display:grid;place-items:center;font:13px var(--serif);font-style:normal;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14)}
.pp span.on{color:var(--t1);font-weight:600}.pp span.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.row{display:flex;align-items:center;gap:14px;min-height:44px;padding:8px 0;border-top:.5px solid var(--line)}
.row:first-child{border-top:0}
.lab{flex:1;min-width:0;line-height:1.4}.lab b{display:block;font-weight:400;font-size:13px}.lab small{display:block;font-size:11px;color:var(--t3)}
/* 样张：照现在的纸、字、字号、行距 */
.sample{border-radius:6px;padding:18px 20px;font-family:var(--sf);font-size:var(--fs);line-height:var(--lh);background:var(--pb);color:var(--pi);transition:background-color .35s,color .35s}
.sample h4{margin:0 0 8px;text-align:center;font-size:1.05em;letter-spacing:.3em;font-weight:600}
.sample p{margin:0;text-indent:var(--ind);text-align:var(--ta)}
/* ---------------- 1 在书上直接改 ---------------- */
.w1{width:900px;height:620px;background:var(--desk)}
.w1 .tbar{position:absolute;left:84px;top:13px;font-size:13px;font-weight:600}
.w1 .pg{position:absolute;left:112px;top:66px;width:400px;height:520px;border-radius:4px;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04),0 18px 40px rgba(51,46,41,.14);overflow:visible}
.w1 .pg .sample{position:absolute;inset:0;padding:54px var(--mg) 0;border-radius:4px;overflow:hidden}
.w1 .pg .no{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:10.5px;color:var(--pi);opacity:.5}
.w1 .hd{position:absolute;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--t2);white-space:nowrap;user-select:none}
.w1 .grip{width:16px;height:30px;border-radius:5px;background:var(--card);box-shadow:var(--zsh);display:grid;place-items:center;cursor:ew-resize;color:var(--t3);font-size:10px}
.w1 .grip.v{width:30px;height:16px;cursor:ns-resize}
.w1 .guide{position:absolute;top:40px;bottom:40px;width:0;border-left:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);pointer-events:none}
.w1 .papers{position:absolute;left:112px;top:40px;display:flex;gap:6px}
.w1 .papers i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2);cursor:pointer}
.w1 .papers i.on{box-shadow:0 0 0 2px var(--desk),0 0 0 3.5px var(--accent)}
.w1 .fonts{position:absolute;left:112px;top:596px}
.w1 .knobs{position:absolute;left:24px;top:110px;width:70px;display:flex;flex-direction:column;align-items:center;gap:26px}
.w1 .knobs>span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--t3);text-align:center;line-height:1.3}
.w1 .knobs b{color:var(--t1);font-size:13px;font-variant-numeric:tabular-nums}
.w1 .tip{position:absolute;left:520px;top:66px;width:0}
.w1 .side{position:absolute;left:548px;top:52px;right:20px;bottom:20px;overflow:auto;padding:4px 4px 0}
.w1 .side h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--t3)}
.w1 .acc{border-radius:12px;background:var(--card);box-shadow:var(--zsh);margin-bottom:8px;padding:0 14px}
.w1 .acc>b{display:flex;align-items:center;gap:8px;height:42px;font-size:13px;cursor:pointer}
.w1 .acc>b small{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--t3)}
.w1 .acc>b .ico{color:var(--t2)}
.w1 .acc .row{min-height:40px}
.w1 .acc .sl input{width:110px}
.w1 .acc .seg button{padding:0 7px}
/* ---------------- 2 读书方式 ---------------- */
.w2{width:900px;height:620px;background:var(--bg)}
.w2 .in{position:absolute;inset:0;overflow:auto;padding:50px 34px 26px}
.w2 h2{margin:0;font-size:22px;font-weight:700}
.w2 .sub{margin:4px 0 18px;font-size:12px;color:var(--t2)}
.w2 .modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.w2 .mode{position:relative;display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:16px;background:var(--card);box-shadow:var(--zsh);cursor:pointer;transition:transform .2s var(--e),box-shadow .2s}
.w2 .mode:hover{transform:translateY(-2px)}
.w2 .mode.on{box-shadow:0 0 0 2px var(--accent),var(--zsh)}
.w2 .mode .mini{height:104px;border-radius:9px;padding:12px 14px;font:11px/1.9 var(--serif);overflow:hidden}
.w2 .mode .mini b{display:block;text-align:center;letter-spacing:.2em;margin-bottom:2px}
.w2 .mode>div:last-child{padding:0 4px 4px}
.w2 .mode strong{display:block;font-size:13.5px}
.w2 .mode small{display:block;margin-top:2px;font-size:11px;color:var(--t3)}
.w2 .mode .when{position:absolute;right:16px;top:16px;padding:2px 7px;border-radius:9px;background:rgba(0,0,0,.35);color:#fff;font-size:10px}
.w2 .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:18px}
.w2 .gl{margin:0 4px 6px;font-size:11.5px;font-weight:600;color:var(--t2)}
.w2 .box{padding:0 16px;border-radius:12px;background:var(--card);box-shadow:var(--zsh)}
.w2 .box .sl input{width:120px}
.w2 .foot{display:flex;gap:18px;margin-top:20px;padding-top:14px;border-top:.5px solid var(--line);font-size:12px;color:var(--t2)}
.w2 .foot a{display:flex;align-items:center;gap:5px;cursor:pointer}
/* ---------------- 3 一次阅读 ---------------- */
.w3{width:1040px;height:600px;background:var(--bg)}
.w3 .in{position:absolute;inset:0;padding:50px 28px 24px;display:flex;flex-direction:column}
.w3 h2{margin:0;font-size:22px;font-weight:700}
.w3 .sub{margin:4px 0 22px;font-size:12px;color:var(--t2)}
.w3 .line{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;flex:1;min-height:0}
.w3 .st{display:flex;flex-direction:column;min-height:0}
.w3 .st header{position:relative;display:flex;align-items:center;gap:8px;padding-bottom:12px;font-size:13.5px;font-weight:700}
.w3 .st header i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font:600 11px var(--sans);font-style:normal;flex:none;z-index:1}
.w3 .st header::after{content:"";position:absolute;left:22px;right:-12px;top:11px;height:1px;background:color-mix(in srgb,var(--accent) 30%,transparent)}
.w3 .st:last-child header::after{display:none}
.w3 .st header small{font-weight:400;font-size:11px;color:var(--t3)}
.w3 .col{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.w3 .it{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;background:var(--card);box-shadow:var(--zsh)}
.w3 .it .lab b{font-size:12.5px}
.w3 .it.inl{flex-direction:row;align-items:center}
.w3 .it .sl input{width:100%}.w3 .it .sl{width:100%}
.w3 .it .seg{align-self:flex-start;flex-wrap:wrap}
.w3 .it .seg button{padding:0 7px}
.w3 .it .pp{gap:4px}.w3 .it .pp i{width:26px;height:22px;font-size:11px}
/* ---------------- 4 只看改过的 ---------------- */
.w4{width:640px;min-height:480px;background:var(--bg)}
.w4 .in{padding:56px 40px 30px}
.w4 h2{margin:0;font-size:34px;font-weight:300;letter-spacing:-.01em}
.w4 h2 b{font-weight:700}
.w4 .sub{margin:6px 0 22px;font-size:12.5px;color:var(--t2)}
.w4 .box{padding:0 16px;border-radius:12px;background:var(--card);box-shadow:var(--zsh)}
.w4 .row .lab small a{color:var(--accent);cursor:pointer}
.w4 .row.fresh{animation:w4in .35s var(--e)}
@keyframes w4in{from{opacity:0;transform:translateY(-4px)}}
.w4 .empty{padding:26px 0;text-align:center;font-size:12.5px;color:var(--t3)}
.w4 .ask{position:relative;margin-top:16px}
.w4 .ask label{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:var(--card);box-shadow:var(--zsh);font-size:13px;color:var(--t3)}
.w4 .ask input{flex:1;border:0;outline:0;background:none;font:inherit;color:var(--t1)}
.w4 .sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.w4 .sugg span{height:26px;padding:0 10px;border-radius:13px;background:var(--inset);display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t2);cursor:pointer}
.w4 .sugg span:hover{color:var(--t1)}
.w4 .sugg .ico{width:12px;height:12px}
.w4 .ver{display:flex;align-items:center;gap:10px;margin-top:26px;font-size:11px;color:var(--t3)}
.w4 .ver img{width:22px;height:22px;border-radius:5px}
/* ---------------- 5 问一句 ---------------- */
.w5{width:880px;height:600px;background:var(--bg)}
.w5 .l{position:absolute;left:0;top:0;bottom:0;width:520px;padding:90px 44px 30px;display:flex;flex-direction:column}
.w5 h2{margin:0 0 16px;font-size:26px;font-weight:700}
.w5 form{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 16px;border-radius:14px;background:var(--card);box-shadow:0 0 0 .5px var(--line),0 8px 24px rgba(51,46,41,.08)}
.w5 form input{flex:1;border:0;outline:0;background:none;font:15px var(--sans);color:var(--t1)}
.w5 form button{height:32px;padding:0 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 12.5px var(--sans);cursor:pointer}
.w5 .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.w5 .chips span{height:28px;padding:0 12px;border-radius:14px;background:var(--inset);display:flex;align-items:center;font-size:12px;color:var(--t2);cursor:pointer}
.w5 .chips span:hover{background:var(--accent-soft);color:var(--accent)}
.w5 .say{min-height:20px;margin:12px 2px 0;font-size:12px;color:var(--t3)}
.w5 .log{flex:1;overflow:auto;margin-top:16px;border-top:.5px solid var(--line)}
.w5 .log div{display:flex;align-items:center;gap:10px;height:40px;border-bottom:.5px solid var(--line);font-size:12.5px;animation:w4in .3s var(--e)}
.w5 .log div em{font-style:normal;color:var(--t3);font-size:11.5px}
.w5 .log div a{margin-left:auto;font-size:11.5px;color:var(--accent);cursor:pointer}
.w5 .log p{margin:14px 0;font-size:11.5px;color:var(--t3)}
.w5 .r{position:absolute;left:520px;top:0;right:0;bottom:0;background:var(--desk);padding:56px 34px 30px}
.w5 .r .sample{height:420px;overflow:hidden;border-radius:4px;padding:34px var(--mg);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 14px 30px rgba(51,46,41,.12)}
.w5 .r .now{margin-top:14px;font-size:11.5px;line-height:1.7;color:var(--t2)}
.w5 .r .now a{color:var(--accent);cursor:pointer}
/* ---------------- 6 书口索引 ---------------- */
.w6{width:880px;height:620px;background:var(--desk)}
.w6 .bk{position:absolute;left:70px;top:44px;width:640px;bottom:30px;border-radius:3px 6px 6px 3px;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04),0 20px 44px rgba(51,46,41,.14)}
.w6 .bk::after{content:"";position:absolute;top:2px;bottom:2px;right:-5px;width:5px;border-radius:0 3px 3px 0;background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--pi) 18%,var(--pb)) 0 1px,var(--pb) 1px 2.5px)}
.w6 .bk>.sample{position:absolute;inset:0;border-radius:3px 6px 6px 3px;padding:48px 56px;overflow:auto}
.w6 .bk h1{margin:0 0 4px;font:600 22px var(--serif);letter-spacing:.2em;text-align:center}
.w6 .bk .kick{margin:0 0 26px;text-align:center;font:11px var(--sans);letter-spacing:.2em;opacity:.55}
.w6 .bk .ex{font-size:var(--fs);line-height:var(--lh);margin:0 0 22px;padding-bottom:18px;border-bottom:.5px solid color-mix(in srgb,var(--pi) 18%,transparent)}
.w6 .bk .row{border-top-color:color-mix(in srgb,var(--pi) 14%,transparent);font-family:var(--sans)}
.w6 .bk .row:first-child{border-top:0}
.w6 .bk .lab b{font-family:var(--serif);font-size:14px;color:var(--pi)}
.w6 .bk .gl{margin:18px 0 4px;font:11px var(--sans);letter-spacing:.2em;color:var(--pi);opacity:.55}
.w6 .bk .about{color:var(--pi)}
.w6 .tabs{position:absolute;left:715px;top:70px;display:flex;flex-direction:column;gap:6px}
.w6 .tabs span{width:46px;padding:12px 0;border-radius:0 8px 8px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font:13px var(--serif);writing-mode:vertical-rl;letter-spacing:.3em;cursor:pointer;color:var(--t2);background:color-mix(in srgb,var(--card) 70%,var(--desk));box-shadow:0 0 0 .5px rgba(0,0,0,.08),2px 2px 6px rgba(51,46,41,.06);transform:translateX(-10px);transition:transform .25s var(--e),background-color .2s}
.w6 .tabs span:hover{transform:translateX(-4px)}
.w6 .tabs span.on{transform:none;background:var(--accent);color:#fff;font-weight:600}
.w6 .turn{animation:w6t .38s var(--e)}
@keyframes w6t{from{opacity:.2;transform:translateX(14px)}}
/* 关于页 */
.about{display:flex;align-items:center;gap:16px;padding:6px 0 14px}
.about img{width:64px;height:64px;border-radius:14px;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 6px 16px rgba(30,28,24,.12)}
.about b{display:block;font-size:20px}.about small{font-size:12px;color:var(--t2)}
/* 切换条：照 prototype 规范原样 */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}.v5 .pane,.tg::after{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
</style></head>
<body>
<div class="stage"><p class="cap" id="cap"></p><div id="stage"></div></div>
<nav class="proto-picker" aria-label="六种设置窗口">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">在书上直接改</button>
  <button class="proto-picker-item">读书方式</button>
  <button class="proto-picker-item">一次阅读</button>
  <button class="proto-picker-item">只看改过的</button>
  <button class="proto-picker-item">问一句</button>
  <button class="proto-picker-item">书口索引</button>
</nav>
<script>
/* ===== 一份设置、一份状态；六种窗口只是六种摆法 ===== */

/* ---- 6 书口索引：书口上贴着索引签，点哪个签翻到哪一章 ---- */
var CH=[['读',['page','fl']],['听',['voice','listen']],['帮手',['ai']],['数据',['sync','store']],['其他',['gen','about']]],T6=0;
function W6(){var c=CH[T6];return '<div class="win w6"><div class="lights"><i></i><i></i><i></i></div><div class="bk"><div class="sample turn" data-sample style="'+SV()+'"><h1>'+c[0]+'</h1><p class="kick">第 '+['一','二','三','四','五'][T6]+' 章</p>'+
  (T6===0?'<div class="ex">'+TXT.split('</p>')[0]+'</p></div>':'')+c[1].map(function(id){var p=BY[id];return '<p class="gl">'+p.n+'</p>'+GROUPS(p,0,'in');}).join('')+'</div></div>'+
  '<div class="tabs">'+CH.map(function(x,i){return '<span class="'+(i===T6?'on':'')+'" data-tab="'+i+'">'+x[0]+'</span>';}).join('')+'</div></div>';}

var VARS=[W1,W2,W3,W4,W5,W6];
var CAPS=['<b>在书上直接改</b>：窗口中间就是一页书。页边、字号、行距在书旁边的小把手上拖，纸色点书上方的小圆；改的就是你看到的那页。别的设置在右边，一样一行，点开才展开。',
  '<b>读书方式</b>：不按“字、声音、同步”分，按场景分——白天纸书、夜里、通勤听书、外文精读。挑一种，语阅就照它排；每一种里只放和它有关的四样，旁边是样张。',
  '<b>一次阅读</b>：按“什么时候用得上”排成一条线——打开书、读、听、晚上、合上以后。哪一步不舒服，就改那一步。',
  '<b>只看改过的</b>：默认的都不显示，窗口里只有你改过的几样，每样能“改回默认”。想改别的，在底下说一声（或点建议），它就加进来。',
  '<b>问一句</b>：写一句话就改好——“字大一点”“夜里用暗纸”“念慢一点”。下面记着刚才改了什么，每条都能撤销；右边是照现在设置排的书页。',
  '<b>书口索引</b>：窗口就是一本书，书口上贴着索引签（读、听、帮手、数据、其他）。点哪个签翻到哪一章，设置就排在那一页上，纸色就是你选的纸。'];
var stage=document.getElementById('stage'),current=0;
function render(){var sc=stage.querySelector('.side,.in,.col,.l .log,.bk .sample'),top=sc?sc.scrollTop:0;stage.innerHTML=VARS[current]();document.getElementById('cap').innerHTML=CAPS[current];
  var f=document.getElementById('w5f');if(f)f.onsubmit=function(e){e.preventDefault();var q=document.getElementById('w5q');if(q.value.trim()){ASK(q.value.trim());render();document.getElementById('w5q').focus();}};
  var q4=document.getElementById('w4q');if(q4)q4.oninput=function(){document.getElementById('w4s').innerHTML=SUGG(q4.value);};
  var sc2=stage.querySelector('.side,.in,.col,.l .log,.bk .sample');if(sc2&&!stage.querySelector('.turn.fresh'))sc2.scrollTop=top;}
function refreshSamples(){[].forEach.call(document.querySelectorAll('[data-sample]'),function(e){e.setAttribute('style',SV());});}
stage.addEventListener('click',function(e){var t=e.target,x;
  if(x=t.closest('[data-acc]')){OPEN1=OPEN1===x.dataset.acc?null:x.dataset.acc;render();return;}
  if(x=t.closest('[data-mode]')){M2=+x.dataset.mode;var s=MODES[M2].set;for(var k in s)S[k]=s[k];render();return;}
  if(x=t.closest('[data-pop]')){current=0;OPEN1=x.dataset.pop;setActive(0);return;}
  if(x=t.closest('[data-add]')){var k=x.dataset.add;PIN.push(k);FRESH=k;render();FRESH=null;return;}
  if(x=t.closest('[data-reset]')){S[x.dataset.reset]=D[x.dataset.reset];render();return;}
  if(x=t.closest('[data-chip]')){ASK(x.dataset.chip);render();return;}
  if(x=t.closest('[data-undo]')){var l=LOG.splice(+x.dataset.undo,1)[0];S[l.k]=l.old;render();return;}
  if(t.closest('[data-goall]')){setActive(0);return;}
  if(x=t.closest('[data-tab]')){T6=+x.dataset.tab;render();return;}
  if(t.closest('[data-drag]'))return;
  var kk=t.closest('[data-k]');if(!kk||kk.tagName==='INPUT')return;
  var key=kk.dataset.k;if(kk.classList.contains('tg'))S[key]=S[key]?0:1;else S[key]=+kk.dataset.v;render();});
stage.addEventListener('input',function(e){var k=e.target.dataset.k;if(!k)return;S[k]=+e.target.value;var o=stage.querySelector('[data-o="'+k+'"]');if(o)o.textContent=FV(k);refreshSamples();});
stage.addEventListener('change',function(e){if(e.target.dataset.k)render();});
/* 书上的小把手：按住拖 */
stage.addEventListener('pointerdown',function(e){var g=e.target.closest('[data-drag]');if(!g)return;e.preventDefault();var k=g.dataset.drag,r=LAB[k][0],ax=g.dataset.ax,dir=+g.dataset.dir,st=r[5],x0=e.clientX,y0=e.clientY,v0=S[k];g.setPointerCapture(e.pointerId);
  g.onpointermove=function(ev){var d=(ax==='x'?ev.clientX-x0:ev.clientY-y0)*dir,v=Math.min(r[4],Math.max(r[3],v0+Math.round(d/(ax==='x'?4:8))*st));v=+v.toFixed(1);if(v!==S[k]){S[k]=v;refreshSamples();var o=stage.querySelector('[data-o="'+k+'"]');if(o)o.textContent=FV(k);if(k==='mg'){var gs=stage.querySelectorAll('.guide');gs[0].style.left=v+'px';gs[1].style.right=v+'px';}}};
  g.onpointerup=function(){g.onpointermove=null;render();};});
/* 切换条：照 prototype 规范的接线 */
var picker=document.querySelector('.proto-picker'),hl=picker.querySelector('.proto-picker-highlight'),items=[].slice.call(picker.querySelectorAll('.proto-picker-item'));
function moveHighlight(){var el=items[current];hl.style.width=el.offsetWidth+'px';hl.style.transform='translateX('+el.offsetLeft+'px)';}
function setActive(i){if(i<0||i>=VARS.length)return;current=i;items.forEach(function(el,j){el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});
  moveHighlight();var url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);render();}
items.forEach(function(el,i){el.addEventListener('click',function(){setActive(i);});});
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',function(e){if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  var n=parseInt(e.key,10);if(n>=1&&n<=VARS.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%VARS.length);else if(e.key==='ArrowLeft')setActive((current-1+VARS.length)%VARS.length);});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(function(){requestAnimationFrame(function(){picker.setAttribute('data-ready','');});});
</script>
</body></html>
