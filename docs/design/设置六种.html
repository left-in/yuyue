<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置六种</title>
<style>
/* 颜色、字号都取自现在的 App：apple/Yuyue/Design/Tokens.swift 和书架窗口（MacShelfView.swift 的 ShelfDesk） */
:root{--bg:#F6F5F3;--card:#FFFFFF;--inset:#EFEEEB;--line:#E7E5E1;--t1:#2A2B2E;--t2:#6E6B68;--t3:#8A8682;--accent:#2B4C7E;--accent-soft:rgba(43,76,126,.1);
  --desk:#EAE8E3;--wash:rgba(42,43,46,.07);--field:rgba(0,0,0,.05);--zsh:0 0 0 .5px rgba(0,0,0,.07),0 1px 2px rgba(51,46,41,.04),0 8px 24px rgba(51,46,41,.05);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;--serif:"Songti SC","Noto Serif SC","STSong",serif;--e:cubic-bezier(.2,0,0,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101112;--card:#1B1C1E;--inset:#26272A;--line:#2C2D30;--t1:#EDEDEE;--t2:#9A9895;--t3:#8E8C89;--accent:#8FA8C8;--accent-soft:rgba(143,168,200,.16);
  --desk:#0C0C0D;--wash:rgba(255,255,255,.08);--field:rgba(255,255,255,.06);--zsh:0 0 0 .5px rgba(255,255,255,.06);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:color-mix(in srgb,var(--bg) 70%,#d9d6cf);font-family:var(--sans);color:var(--t1);-webkit-font-smoothing:antialiased}
@media (prefers-color-scheme:dark){body{background:#050506}}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 20px 110px}
.cap{max-width:860px;text-align:center;font-size:13px;line-height:1.7;color:var(--t2)}
.cap b{color:var(--t1)}
/* 窗口 */
.win{position:relative;overflow:hidden;border-radius:12px;background:var(--bg);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 30px 70px rgba(51,46,41,.18);font-size:13px}
.lights{position:absolute;left:16px;top:16px;display:flex;gap:8px;z-index:5}
.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* 通用控件：和 App 一样的开关、分段、滑杆、按钮 */
.tg{position:relative;width:30px;height:18px;border-radius:9px;background:var(--inset);box-shadow:inset 0 0 0 .5px var(--line);flex:none;cursor:pointer;transition:background-color .2s}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--e)}
.tg.on{background:var(--accent);box-shadow:none}.tg.on::after{transform:translateX(12px)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--inset);flex:none}
.seg button{height:22px;padding:0 10px;border:0;border-radius:6px;background:none;font:11.5px var(--sans);color:var(--t2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--t1);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px var(--line)}
.sl{display:flex;align-items:center;gap:10px;flex:none}
.sl input{width:150px;accent-color:var(--accent)}
.sl b{min-width:34px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.btn{height:24px;padding:0 11px;border:0;border-radius:12px;background:var(--inset);font:500 11.5px var(--sans);color:var(--t1);cursor:pointer;white-space:nowrap;flex:none}
.btn.k{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.k{color:#101214}}
.btn:active{transform:scale(.96)}
.pp{display:flex;gap:8px;flex:none}
.pp span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--t2);cursor:pointer}
.pp i{width:34px;height:26px;border-radius:6px;display:grid;place-items:center;font:13px var(--serif);font-style:normal;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14)}
.pp span.on{color:var(--t1);font-weight:600}.pp span.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.row{display:flex;align-items:center;gap:14px;min-height:44px;padding:8px 0;border-top:.5px solid var(--line)}
.row:first-child{border-top:0}
.lab{flex:1;min-width:0;line-height:1.4}.lab b{display:block;font-weight:400;font-size:13px}.lab small{display:block;font-size:11px;color:var(--t3)}
/* 样张：照现在的纸、字、字号、行距 */
.sample{border-radius:6px;padding:18px 20px;font-family:var(--sf);font-size:var(--fs);line-height:var(--lh);background:var(--pb);color:var(--pi);transition:background-color .35s,color .35s}
.sample h4{margin:0 0 8px;text-align:center;font-size:1.05em;letter-spacing:.3em;font-weight:600}
.sample p{margin:0;text-indent:var(--ind);text-align:var(--ta)}
/* ---------------- 1 书架同款 ---------------- */
.v1{width:860px;height:580px;background:var(--desk)}
.v1 .side{position:absolute;left:0;top:0;bottom:0;width:200px;padding:46px 10px 10px}
.v1 .srch{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;border-radius:9px;background:var(--field);font-size:12px;color:var(--t2)}
.v1 .srch kbd{margin-left:auto;font:10.5px var(--sans);color:var(--t3)}
.v1 .gt{margin:0;padding:14px 8px 4px;font-size:10.5px;font-weight:600;color:var(--t3)}
.v1 .it{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:8px;font-size:12px;cursor:pointer}
.v1 .it .ico{color:var(--t2)}
.v1 .it.on{background:var(--wash);font-weight:600}.v1 .it.on .ico{color:var(--t1)}
.v1 .it:not(.on):hover{background:color-mix(in srgb,var(--wash) 50%,transparent)}
.v1 .paper{position:absolute;left:208px;top:8px;right:8px;bottom:8px;border-radius:12px;background:var(--bg);box-shadow:0 0 0 .5px rgba(0,0,0,.07),0 1px 3px rgba(51,46,41,.06),0 8px 24px rgba(51,46,41,.06);overflow:auto;padding:0 28px 28px}
.v1 h2{margin:0;padding-top:26px;font-size:22px;font-weight:700}
.v1 .sub{margin:4px 0 18px;font-size:12px;color:var(--t2)}
.v1 .gl{margin:16px 4px 6px;font-size:11.5px;font-weight:600;color:var(--t2)}
.v1 .box{padding:0 16px;border-radius:12px;background:var(--card);box-shadow:var(--zsh)}
.v1 .sample{margin:0 0 4px;border-radius:12px;box-shadow:var(--zsh);max-height:148px;overflow:hidden}
/* ---------------- 2 顶上一排标签 ---------------- */
.v2{width:700px;background:var(--bg)}
.v2 .bar{height:92px;background:color-mix(in srgb,var(--card) 55%,var(--bg));box-shadow:inset 0 -.5px 0 var(--line);position:relative}
.v2 .bar h1{position:absolute;left:0;right:0;top:11px;margin:0;text-align:center;font-size:13px;font-weight:600}
.v2 .tabs{position:absolute;left:0;right:0;top:36px;display:flex;justify-content:center;gap:2px}
.v2 .tabs span{width:66px;height:48px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--t2);cursor:pointer}
.v2 .tabs .ico{width:19px;height:19px}
.v2 .tabs span.on{background:var(--inset);color:var(--t1);font-weight:600}.v2 .tabs span.on .ico{color:var(--accent)}
.v2 .body{padding:20px 40px 28px;display:flex;flex-direction:column;gap:12px}
.v2 .box{padding:0 16px;border-radius:12px;background:var(--card);box-shadow:var(--zsh)}
.v2 .gl{margin:4px 4px -6px;font-size:11.5px;font-weight:600;color:var(--t2)}
.v2 .sample{max-height:120px;overflow:hidden;box-shadow:var(--zsh);border-radius:12px}
/* ---------------- 3 一页滚到底 ---------------- */
.v3{width:780px;height:600px;background:var(--bg)}
.v3 .idx{position:absolute;left:0;top:0;bottom:0;width:170px;padding:54px 0 0 26px}

.v3 .idx a{display:block;position:relative;padding:5px 0 5px 12px;font-size:12.5px;color:var(--t3);cursor:pointer;text-decoration:none;transition:color .2s}
.v3 .idx a::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:1px;background:var(--accent);transform:scaleY(0);transition:transform .25s var(--e)}
.v3 .idx a.on{color:var(--t1);font-weight:600}.v3 .idx a.on::before{transform:none}
.v3 .scroll{position:absolute;left:170px;top:0;right:0;bottom:0;overflow:auto;padding:46px 40px 240px 20px;scroll-behavior:smooth}
.v3 section{padding-bottom:30px}
.v3 section h2{display:flex;align-items:baseline;gap:10px;margin:0 0 4px;font-size:19px;font-weight:700}
.v3 section h2 small{font-size:12px;font-weight:400;color:var(--t3)}
.v3 .sub{margin:0 0 10px;font-size:12px;color:var(--t2)}
.v3 .box{border-top:.5px solid var(--line);border-bottom:.5px solid var(--line)}
.v3 .sample{margin:10px 0 6px;max-height:140px;overflow:hidden}
/* ---------------- 4 图标栏 + 样张在上 ---------------- */
.v4{width:840px;height:600px;background:var(--bg)}
.v4 .rail{position:absolute;left:0;top:0;bottom:0;width:76px;padding-top:50px;background:var(--desk);display:flex;flex-direction:column;align-items:center;gap:2px}
.v4 .rail span{width:60px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--t2);cursor:pointer}
.v4 .rail .ico{width:18px;height:18px}
.v4 .rail span.on{background:var(--card);color:var(--t1);font-weight:600;box-shadow:var(--zsh)}.v4 .rail span.on .ico{color:var(--accent)}
.v4 .main{position:absolute;left:76px;top:0;right:0;bottom:0;overflow:auto;padding:0 30px 30px}
.v4 h2{margin:0;padding-top:24px;font-size:22px;font-weight:700}
.v4 .sub{margin:4px 0 16px;font-size:12px;color:var(--t2)}
.v4 .hero{height:170px;overflow:hidden;border-radius:14px;margin-bottom:16px;box-shadow:var(--zsh)}
.v4 .hero .sample{height:100%;border-radius:14px;padding:22px 34px}
.v4 .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.v4 .cell{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:12px;background:var(--card);box-shadow:var(--zsh)}
.v4 .cell .lab b{font-weight:600;font-size:12.5px}
.v4 .cell.wide{grid-column:1/-1}
/* ---------------- 5 先看总览，再点进去 ---------------- */
.v5{width:760px;height:580px;background:var(--bg)}
.v5 .pane{position:absolute;inset:0;padding:52px 32px 28px;overflow:auto;transition:transform .32s var(--e),opacity .25s}
.v5 .home h2,.v5 .detail h2{margin:0 0 4px;font-size:22px;font-weight:700}
.v5 .home .sub{margin:0 0 18px;font-size:12px;color:var(--t2)}
.v5 .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.v5 .tile{display:flex;flex-direction:column;gap:8px;min-height:104px;padding:14px 16px;border-radius:14px;background:var(--card);box-shadow:var(--zsh);cursor:pointer;transition:transform .15s}
.v5 .tile:hover{transform:translateY(-1px)}.v5 .tile:active{transform:scale(.98)}
.v5 .tile .ico{width:18px;height:18px;color:var(--accent)}
.v5 .tile b{font-size:13.5px}
.v5 .tile small{margin-top:auto;font-size:12px;line-height:1.45;color:var(--t2)}
.v5 .tile.big{grid-column:span 2;flex-direction:row;align-items:stretch;gap:16px}
.v5 .tile.big .sample{flex:1;max-height:118px;overflow:hidden;padding:12px 16px}
.v5 .tile.big>div{display:flex;flex-direction:column;gap:8px;width:120px}
.v5 .detail{transform:translateX(100%);opacity:0;pointer-events:none}
.v5.open .home{transform:translateX(-24%);opacity:0;pointer-events:none}
.v5.open .detail{transform:none;opacity:1;pointer-events:auto}
.v5 .back{display:inline-flex;align-items:center;gap:2px;margin:0 0 10px -4px;padding:2px 4px;border:0;background:none;font:13px var(--sans);color:var(--accent);cursor:pointer}
.v5 .box{padding:0 16px;border-radius:12px;background:var(--card);box-shadow:var(--zsh)}
.v5 .gl{margin:14px 4px 6px;font-size:11.5px;font-weight:600;color:var(--t2)}
.v5 .detail .sample{margin:10px 0 4px;max-height:130px;overflow:hidden;box-shadow:var(--zsh);border-radius:12px}
/* ---------------- 6 在书旁边改 ---------------- */
.v6{width:900px;height:600px;background:var(--desk)}
.v6 .book{position:absolute;left:8px;top:8px;bottom:8px;width:540px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.07),0 8px 24px rgba(51,46,41,.08)}
.v6 .book .sample{height:100%;border-radius:12px;padding:70px 56px}
.v6 .book .no{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:10.5px;color:var(--pi);opacity:.5}
.v6 .insp{position:absolute;left:556px;top:0;right:0;bottom:0;padding:16px 18px 16px 10px;display:flex;flex-direction:column}
.v6 .insp .seg{align-self:stretch;display:flex}.v6 .insp .seg button{flex:1;height:26px;font-size:12px}
.v6 .insp .scroll{flex:1;overflow:auto;margin-top:12px}
.v6 .gl{margin:14px 2px 6px;font-size:11px;font-weight:600;color:var(--t3)}
.v6 .gl:first-child{margin-top:0}
.v6 .box{padding:0 14px;border-radius:12px;background:var(--card);box-shadow:var(--zsh)}
.v6 .box .sl input{width:110px}
.v6 .more{display:flex;align-items:center;justify-content:space-between;height:36px;margin-top:10px;padding:0 12px;border-radius:10px;background:var(--wash);font-size:12.5px;cursor:pointer}
.v6 .sheet{position:absolute;inset:0;background:rgba(0,0,0,.18);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
.v6.sh .sheet{opacity:1;pointer-events:auto}
.v6 .sheet>div{width:440px;max-height:480px;overflow:auto;padding:20px 22px;border-radius:14px;background:var(--bg);box-shadow:0 20px 60px rgba(0,0,0,.25);transform:scale(.97);transition:transform .25s var(--e)}
.v6.sh .sheet>div{transform:none}
.v6 .sheet h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px;font-size:16px}
/* 关于页 */
.about{display:flex;align-items:center;gap:16px;padding:6px 0 14px}
.about img{width:64px;height:64px;border-radius:14px;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 6px 16px rgba(30,28,24,.12)}
.about b{display:block;font-size:20px}.about small{font-size:12px;color:var(--t2)}
/* 切换条：照 prototype 规范原样 */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}.v5 .pane,.tg::after{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
</style></head>

</nav>

var PAGES=[
 {id:'page',n:'书页',i:'book',g:'读',d:'书上的字和纸。改的是所有书。',now:function(){return S.fs+' 号'+FONT[S.font][0]+' · '+PAPER[S.paper][0];},sample:1,
  G:[['纸',[['paper','纸色','pp'],['night','晚上换夜间纸','tg']]],['字',[['font','字体','seg',FONT.map(function(f){return f[0];})],['fs','字号','sl',12,22,1],['lh','行距','sl',1.5,2.6,.1]]],['排版',[['turn','翻页','seg',['左右翻','上下滚']],['ind','段首空两格','tg'],['just','两端对齐','tg']]]]},
 {id:'fl',n:'外文',i:'trans',g:'读',d:'读英文书时，难词头上写一个中文意思。',now:function(){return S.gloss?'比'+LV[S.lv]+'难的词':'不标难词';},
  G:[['难词注释',[['gloss','在难词上写中文','tg'],['lv','从哪一级起','seg',LV],['gm','怎么标','seg',['写中文','划一道线']]]],['词典',[['','柯林斯双解、牛津高阶','btn','导入 MDict…']]]]},
 {id:'voice',n:'声音',i:'wave',g:'听',d:'听书时谁来念、念多快。',now:function(){return ZH[S.zh]+' · '+S.speed.toFixed(1)+'×';},sample:1,
  G:[['谁来念',[['zh','中文书','seg',ZH],['en','英文书','seg',['Ava','Zoe']],['speed','语速','sl',.6,2,.1],['dlg','对话换一个声音','tg']]],['云端声音',[['','微软 Azure · 中文声音最多','btn','粘贴 Key','k']]]]},
 {id:'listen',n:'听书',i:'headset',g:'听',d:'听书时的几样习惯。',now:function(){return SLP[S.sleep]+'后停';},
  G:[['',[['sleep','睡眠定时','seg',SLP],['foot','跳过脚注和图注','tg'],['awake','听书时 Mac 不睡着','tg']]]]},
 {id:'ai',n:'书伴',i:'spark',g:'帮手',d:'读到不懂的，选中一句问它。',now:function(){return AI[S.ai];},
  G:[['谁来回答',[['ai','书伴','seg',AI],['','剪贴板里有一个 Claude 的 Key','btn','用它','k']]],['什么时候出来',[['tip','读到难处时轻轻提一句','tg'],['quiet','沉浸阅读时不打扰','tg']]]]},
 {id:'sync',n:'同步',i:'sync',g:'数据',d:'读到哪、划线、生词，在几台设备之间跟着走。',now:function(){return S.icloud?'3 台 · 2 分钟前':'关着';},
  G:[['',[['icloud','用 iCloud 同步','tg']]],['同步什么',[['sA','读到哪','tg'],['sB','划线和笔记','tg'],['sC','生词本','tg']]],['这几台',[['','iPad Air · 昨天 22:10','btn','现在同步']]]]},
 {id:'store',n:'存储',i:'disk',g:'数据',d:'语阅在这台 Mac 上占了 3.2 GB。',now:function(){return '3.2 GB';},
  G:[['可以清掉的',[['','听完的有声书 · 1.4 GB','btn','清掉'],['','念过的句子 · 0.5 GB','btn','清掉']]],['备份',[['bk','自动备份','seg',['每天','每周','不备份']],['','笔记和生词','btn','导出…']]]]},
 {id:'gen',n:'通用',i:'sliders',g:'其他',d:'和书无关的几样。',now:function(){return LOOK[S.look];},
  G:[['',[['look','外观','seg',LOOK],['open','打开时接着读上次那本','tg'],['menu','菜单栏里放播放按钮','tg']]]]},
 {id:'about',n:'关于',i:'info',g:'其他',d:'好好读一本书。',now:function(){return '1.0';},about:1,
  G:[['',[['','检查更新','btn','检查'],['','写信给我们','btn','发邮件…'],['','书、笔记和 Key 都只在你的设备上','']]]]}];
var BY={};PAGES.forEach(function(p){BY[p.id]=p;});
function CTL(r){var k=r[0],t=r[2];
  if(t==='tg')return '<span class="tg'+(S[k]?' on':'')+'" data-k="'+k+'" role="switch" aria-checked="'+(S[k]?'true':'false')+'"></span>';
  if(t==='seg')return '<span class="seg">'+r[3].map(function(o,i){return '<button class="'+(S[k]===i?'on':'')+'" data-k="'+k+'" data-v="'+i+'">'+o+'</button>';}).join('')+'</span>';
  if(t==='sl')return '<span class="sl"><input type="range" min="'+r[3]+'" max="'+r[4]+'" step="'+r[5]+'" value="'+S[k]+'" data-k="'+k+'"><b data-o="'+k+'">'+FV(k)+'</b></span>';
  if(t==='pp')return '<span class="pp">'+PAPER.map(function(p,i){return '<span class="'+(S.paper===i?'on':'')+'" data-k="paper" data-v="'+i+'"><i style="background:'+p[1]+';color:'+p[2]+'">文</i>'+p[0]+'</span>';}).join('')+'</span>';
  if(t==='btn')return '<button class="btn'+(r[4]?' '+r[4]:'')+'">'+r[3]+'</button>';return '';}
function FV(k){return k==='speed'?(+S[k]).toFixed(1)+'×':k==='lh'?(+S[k]).toFixed(1):S[k];}
function ROW(r){return '<div class="row"><div class="lab"><b>'+r[1]+'</b></div>'+CTL(r)+'</div>';}
function GROUPS(p,gl,box){return (p.about?'<div class="about"><img src="'+LOGO+'" alt="语阅的图标"><div><b>语阅</b><small>版本 1.0 · 2026 年 11 月</small></div></div>':'')+p.G.map(function(g){return (g[0]&&gl?'<p class="gl">'+g[0]+'</p>':'')+'<div class="'+(box||'box')+'">'+g[1].map(ROW).join('')+'</div>';}).join('');}
function SAMPLE(extra){var p=PAPER[S.paper];return '<div class="sample" data-sample style="'+SV()+'"><h4>背　影</h4><p>我与父亲不相见已二年余了，我最不能忘记的是他的背影。</p><p>那年冬天，祖母死了，父亲的差使也交卸了，正是祸不单行的日子。我从北京到徐州，打算跟着父亲奔丧回家。到徐州见着父亲，看见满院狼藉的东西，又想起祖母，不禁簌簌地流下眼泪。'+(extra||'')+'</p></div>';}
function SV(){var p=PAPER[S.paper];return '--pb:'+p[1]+';--pi:'+p[2]+';--sf:'+FONT[S.font][1]+';--fs:'+S.fs+'px;--lh:'+S.lh+';--ind:'+(S.ind?'2em':'0')+';--ta:'+(S.just?'justify':'left');}
var cur='page';

/* ---- 1 书架同款：桌面色上的侧栏 + 一张纸 ---- */
function V1(){var g='';return '<div class="win v1"><div class="lights"><i></i><i></i><i></i></div><aside class="side"><div class="srch">'+I('search')+'搜索设置<kbd>⌘F</kbd></div>'+
  PAGES.map(function(p){var h=p.g!==g?'<p class="gt">'+p.g+'</p>':'';g=p.g;return h+'<div class="it'+(p.id===cur?' on':'')+'" data-go="'+p.id+'">'+I(p.i)+p.n+'</div>';}).join('')+
  '</aside><main class="paper"><h2>'+BY[cur].n+'</h2><p class="sub">'+BY[cur].d+'</p>'+(BY[cur].sample?SAMPLE():'')+GROUPS(BY[cur],1)+'</main></div>';}
/* ---- 2 顶上一排标签：老派 Mac 偏好设置，窗口窄、一列 ---- */
function V2(){var p=BY[cur];return '<div class="win v2"><div class="lights"><i></i><i></i><i></i></div><div class="bar"><h1>'+p.n+'</h1><div class="tabs">'+PAGES.map(function(q){return '<span class="'+(q.id===cur?'on':'')+'" data-go="'+q.id+'">'+I(q.i)+q.n+'</span>';}).join('')+'</div></div>'+
  '<div class="body">'+(p.sample?SAMPLE():'')+GROUPS(p,1)+'</div></div>';}
/* ---- 3 一页滚到底：左边一列字是目录，跟着滚动走 ---- */
function V3(){return '<div class="win v3"><div class="lights"><i></i><i></i><i></i></div><nav class="idx"><div class="srch">'+I('search')+'搜索</div>'+PAGES.map(function(p){return '<a class="'+(p.id===cur?'on':'')+'" data-jump="'+p.id+'">'+p.n+'</a>';}).join('')+'</nav>'+
  '<div class="scroll" id="v3s">'+PAGES.map(function(p){return '<section id="v3-'+p.id+'"><h2>'+p.n+'<small>'+p.now()+'</small></h2><p class="sub">'+p.d+'</p>'+(p.id==='page'?SAMPLE():'')+GROUPS(p,0)+'</section>';}).join('')+'</div></div>';}
/* ---- 4 窄的图标栏 + 样张在最上面，设置排成两列小卡 ---- */
function V4(){var p=BY[cur];return '<div class="win v4"><div class="lights"><i></i><i></i><i></i></div><nav class="rail">'+PAGES.map(function(q){return '<span class="'+(q.id===cur?'on':'')+'" data-go="'+q.id+'" title="'+q.n+'">'+I(q.i)+q.n+'</span>';}).join('')+'</nav>'+
  '<main class="main"><h2>'+p.n+'</h2><p class="sub">'+p.d+'</p>'+(p.sample?'<div class="hero">'+SAMPLE('父亲说：“事已如此，不必难过，好在天无绝人之路！”')+'</div>':'')+(p.about?GROUPS({G:[],about:1},0):'')+
  '<div class="grid">'+p.G.reduce(function(a,g){return a.concat(g[1]);},[]).map(function(r){var wide=r[2]==='pp'||(r[2]==='seg'&&r[3].length>3)||r[2]==='btn';return '<div class="cell'+(wide?' wide':'')+'"><div class="lab"><b>'+r[1]+'</b></div>'+CTL(r)+'</div>';}).join('')+'</div></main></div>';}
/* ---- 5 先看总览：九块卡片各写着现在的样子，点进去才是细项 ---- */
function V5(){var open=V5.open;return '<div class="win v5'+(open?' open':'')+'"><div class="lights"><i></i><i></i><i></i></div><div class="pane home"><h2>设置</h2><p class="sub">每一块写着现在是什么样，点进去改。</p><div class="tiles">'+
  PAGES.map(function(p){if(p.id==='page')return '<div class="tile big" data-open="page">'+SAMPLE()+'<div>'+I(p.i)+'<b>书页</b><small>'+p.now()+'</small></div></div>';return '<div class="tile" data-open="'+p.id+'">'+I(p.i)+'<b>'+p.n+'</b><small>'+p.now()+'</small></div>';}).join('')+'</div></div>'+
  '<div class="pane detail">'+(open?'<button class="back" data-back>'+I('chev')+'设置</button><h2>'+BY[open].n+'</h2>'+(BY[open].sample?SAMPLE():'')+GROUPS(BY[open],1):'')+'</div></div>';}
/* ---- 6 在书旁边改：左边就是一页书，右边常用的几样；不常用的在“全部设置…” ---- */
var V6TAB=['page','voice','fl','ai'];
function V6(){var t=V6TAB.indexOf(cur)<0?'page':cur,p=BY[t];return '<div class="win v6'+(V6.sh?' sh':'')+'"><div class="lights"><i></i><i></i><i></i></div><div class="book">'+SAMPLE('父亲说：“事已如此，不必难过，好在天无绝人之路！”回家变卖典质，父亲还了亏空；又借钱办了丧事。这些日子，家中光景很是惨淡，一半为了丧事，一半为了父亲赋闲。')+'<span class="no">3</span></div>'+
  '<aside class="insp"><span class="seg">'+V6TAB.map(function(id){return '<button class="'+(id===t?'on':'')+'" data-go="'+id+'">'+BY[id].n+'</button>';}).join('')+'</span><div class="scroll">'+p.G.map(function(g){return (g[0]?'<p class="gl">'+g[0]+'</p>':'')+'<div class="box">'+g[1].map(ROW).join('')+'</div>';}).join('')+'</div>'+
  '<div class="more" data-sheet>全部设置… <span style="color:var(--t3)">听书、同步、存储、通用、关于</span></div></aside>'+
  '<div class="sheet" data-unsheet><div data-stop><h3>全部设置<button class="btn" data-unsheet>完成</button></h3>'+['listen','sync','store','gen','about'].map(function(id){var q=BY[id];return '<p class="gl" style="font-size:12.5px;color:var(--t1);margin:16px 2px 6px">'+q.n+' <span style="font-weight:400;color:var(--t3)">· '+q.now()+'</span></p>'+GROUPS(q,0);}).join('')+'</div></div></div>';}

var VARS=[V1,V2,V3,V4,V5,V6];
var CAPS=['<b>书架同款</b>：和现在的书架窗口一模一样——桌面色上的侧栏（单色图标、淡灰选中），右边一张纸，设置放白色圆角组里；书页、声音在最上面放一条样张。',
  '<b>顶上标签</b>：老派 Mac 偏好设置的样子——窗口窄，标题栏下面一排图标标签，下面一列设置。最省地方、最熟悉。',
  '<b>一页滚到底</b>：没有分页，所有设置从上到下一页排完；左边一列字是目录，滚到哪亮到哪，点一下跳过去。每段标题旁边写着现在的样子。',
  '<b>样张在上</b>：左边一条窄的图标栏；每页最上面一大块样张，照现在的纸和字排；设置排成两列小卡，一眼看完。',
  '<b>先看总览</b>：打开先看到九块卡片，每块写着现在是什么样（书页那块直接是样张）；点一块，细项从右边滑进来，左上角“设置”退回。',
  '<b>在书旁边改</b>：左边就是一页书，右边只放最常改的四页（书页、声音、外文、书伴），改什么书上马上变；不常用的收在“全部设置…”里，点开是一张单子。'];
var stage=document.getElementById('stage'),current=0;
function render(){stage.innerHTML=VARS[current]();document.getElementById('cap').innerHTML=CAPS[current];if(current===2)spy();}
function refreshSamples(){[].forEach.call(document.querySelectorAll('[data-sample]'),function(e){e.setAttribute('style',SV());});}
stage.addEventListener('click',function(e){var t=e.target;
  var go=t.closest('[data-go]');if(go){cur=go.dataset.go;render();return;}
  var j=t.closest('[data-jump]');if(j){var s=document.getElementById('v3s'),sec=document.getElementById('v3-'+j.dataset.jump);s.scrollTop=sec.offsetTop-40;return;}
  var op=t.closest('[data-open]');if(op){V5.open=op.dataset.open;render();return;}
  if(t.closest('[data-back]')){V5.open=null;render();return;}
  if(t.closest('[data-sheet]')){V6.sh=1;render();return;}
  if(t.closest('[data-unsheet]')&&!t.closest('[data-stop]')||t.matches('button[data-unsheet]')){V6.sh=0;render();return;}
  var k=t.closest('[data-k]');if(!k||k.tagName==='INPUT')return;
  var key=k.dataset.k;if(k.classList.contains('tg'))S[key]=S[key]?0:1;else S[key]=+k.dataset.v;
  var sc=stage.querySelector('.scroll,.paper,.main,.pane.detail'),top=sc?sc.scrollTop:0;render();var sc2=stage.querySelector('.scroll,.paper,.main,.pane.detail');if(sc2)sc2.scrollTop=top;});
stage.addEventListener('input',function(e){var k=e.target.dataset.k;if(!k)return;S[k]=+e.target.value;var o=stage.querySelector('[data-o="'+k+'"]');if(o)o.textContent=FV(k);refreshSamples();});
function spy(){var s=document.getElementById('v3s');s.addEventListener('scroll',function(){var best='page';PAGES.forEach(function(p){var el=document.getElementById('v3-'+p.id);if(el.offsetTop-80<=s.scrollTop)best=p.id;});
  if(best!==cur){cur=best;[].forEach.call(document.querySelectorAll('.v3 .idx a'),function(a){a.classList.toggle('on',a.dataset.jump===cur);});}});}
/* 切换条：照 prototype 规范的接线 */
var picker=document.querySelector('.proto-picker'),hl=picker.querySelector('.proto-picker-highlight'),items=[].slice.call(picker.querySelectorAll('.proto-picker-item'));
function moveHighlight(){var el=items[current];hl.style.width=el.offsetWidth+'px';hl.style.transform='translateX('+el.offsetLeft+'px)';}
function setActive(i){if(i<0||i>=VARS.length)return;current=i;items.forEach(function(el,j){el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});
  moveHighlight();var url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);render();}
items.forEach(function(el,i){el.addEventListener('click',function(){setActive(i);});});
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',function(e){if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  var n=parseInt(e.key,10);if(n>=1&&n<=VARS.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%VARS.length);else if(e.key==='ArrowLeft')setActive((current-1+VARS.length)%VARS.length);});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(function(){requestAnimationFrame(function(){picker.setAttribute('data-ready','');});});
</script>
</body></html>
