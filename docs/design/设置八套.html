<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置八套</title>
<style>
/* 颜色取自 apple/Yuyue/Design/Tokens.swift */
:root{--bg:#F6F5F3;--card:#FFFFFF;--inset:#EFEEEB;--line:#E7E5E1;--t1:#2A2B2E;--t2:#6E6B68;--t3:#8A8682;--ok:#3E9B6A;--danger:#C2473A;
  --fill:#2B4C7E;--on:#FFFFFF;--accent:#2B4C7E;--soft:rgba(43,76,126,.12);--desk:#EAE8E3;--wash:rgba(42,43,46,.07);
  --sh:0 0 0 .5px rgba(0,0,0,.05),0 1px 2px rgba(51,46,41,.05);--lift:0 0 0 .5px rgba(0,0,0,.06),0 12px 32px rgba(51,46,41,.12);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;--serif:"Songti SC","Noto Serif SC",STSong,serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;--sp:cubic-bezier(.2,.9,.25,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#DAD7D0;font-family:var(--sans);color:var(--t1);-webkit-font-smoothing:antialiased}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px 16px 100px}
.cap{max-width:900px;text-align:center;font-size:13px;line-height:1.7;color:#55524e}.cap b{color:#2A2B2E}
.win{position:relative;overflow:hidden;border-radius:12px;background:var(--bg);box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 30px 70px rgba(51,46,41,.2);font-size:13px;flex:none}
.lights{position:absolute;left:16px;top:16px;display:flex;gap:8px;z-index:5}.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.ico{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* 通用控件 */
.tg{position:relative;display:inline-block;vertical-align:middle;width:32px;height:20px;border-radius:10px;background:var(--inset);box-shadow:inset 0 0 0 .5px var(--line);flex:none;cursor:pointer;transition:background-color .24s}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .24s var(--sp)}
.tg.on{background:var(--fill);box-shadow:none}.tg.on::after{transform:translateX(12px)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--inset);flex:none}
.seg button{height:24px;padding:0 10px;border:0;border-radius:7px;background:none;font:12px var(--sans);color:var(--t2);cursor:pointer;white-space:nowrap;transition:background-color .14s,color .14s}
.seg button.on{background:var(--card);color:var(--t1);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 .5px var(--line)}
.sl{display:flex;align-items:center;gap:10px;flex:none}
.sl input{width:140px;accent-color:var(--fill)}
.sl b{min-width:34px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.btn{height:26px;padding:0 12px;border:0;border-radius:13px;background:var(--inset);font:500 12px var(--sans);color:var(--t1);cursor:pointer;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.96)}.btn.k{background:var(--fill);color:var(--on)}.btn.done{background:none;color:var(--ok);cursor:default}
.dots{display:flex;gap:8px;flex:none}
.dots i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18);cursor:pointer;transition:box-shadow .2s}
.dots i.on{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18),0 0 0 2px var(--card),0 0 0 3.5px var(--fill)}
.ok{color:var(--ok)}.dim{color:var(--t3)}
.spin{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite}
.btn:not(.k) .spin{border-color:var(--line);border-top-color:var(--accent)}
@keyframes sp{to{transform:rotate(360deg)}}
.sample{background:var(--pb);color:var(--pi);font-family:var(--sf);transition:background-color .35s,color .35s}
.sample h4{margin:0 0 .6em;text-align:center;font-size:1.05em;font-weight:600;letter-spacing:.3em}
.sample p{margin:0;font-size:var(--fs);line-height:var(--lh);text-indent:var(--ind);text-align:var(--ta)}
.sample .hl{background:var(--hl);border-radius:2px}
.row{display:flex;align-items:center;gap:14px;min-height:46px;padding:9px 0;border-top:.5px solid var(--line)}
.row:first-child{border-top:0}
.lab{flex:1;min-width:0;line-height:1.4}.lab b{display:block;font-weight:400}.lab small{display:block;font-size:11.5px;color:var(--t3)}

/* ===== 1 卡片轮播 ===== */
.v1{width:900px;height:620px;background:var(--desk)}
.v1 .pager{position:absolute;left:0;right:0;top:20px;display:flex;justify-content:center;gap:4px}
.v1 .pager span{height:26px;padding:0 11px;border-radius:13px;display:flex;align-items:center;font-size:12px;color:var(--t2);cursor:pointer;transition:background-color .2s,color .2s}
.v1 .pager span.on{background:var(--card);color:var(--t1);font-weight:600;box-shadow:var(--sh)}
.v1 .deck{position:absolute;left:0;right:0;top:70px;bottom:40px}
.v1 .c{position:absolute;left:50%;top:0;width:440px;height:100%;margin-left:-220px;border-radius:20px;background:var(--card);box-shadow:var(--lift);padding:26px 28px;overflow:hidden;transition:transform .45s var(--sp),opacity .35s,filter .35s;cursor:pointer}
.v1 .c h2{margin:0 0 4px;font-size:22px}.v1 .c>p{margin:0 0 16px;font-size:12px;color:var(--t2)}
.v1 .c.mid{cursor:default;overflow:auto}
.v1 .c .sample{border-radius:12px;padding:16px 18px;margin-bottom:10px;max-height:150px;overflow:hidden}
.v1 .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:11px;color:var(--t3)}
/* ===== 2 便当格 ===== */
.v2{width:900px;height:620px;background:var(--desk)}
.v2 .grid{position:absolute;left:20px;right:20px;top:48px;bottom:20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:12px}
.v2 .tile{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:var(--sh);overflow:hidden}
.v2 .tile header{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.v2 .tile header .ico{color:var(--accent)}
.v2 .tile header a{margin-left:auto;width:24px;height:24px;border-radius:12px;display:grid;place-items:center;color:var(--t3);cursor:pointer}
.v2 .tile header a:hover{background:var(--inset);color:var(--t1)}
.v2 .tile .big{font-size:26px;font-weight:600;letter-spacing:-.01em}
.v2 .tile small{font-size:11.5px;color:var(--t3);line-height:1.5}
.v2 .t-read{grid-column:1/3;grid-row:1/3}
.v2 .t-voice{grid-column:3/5}
.v2 .t-read .sample{flex:1;border-radius:12px;padding:16px 18px;overflow:hidden}
.v2 .ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.v2 .bar{height:8px;border-radius:4px;background:var(--inset);overflow:hidden;display:flex}.v2 .bar i{display:block}
.v2 .full{position:absolute;z-index:6;border-radius:18px;background:var(--card);box-shadow:var(--lift);padding:20px 26px;overflow:auto;transition:all .42s var(--sp)}
.v2 .full h2{display:flex;align-items:center;margin:0 0 10px;font-size:20px}.v2 .full h2 a{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--accent);cursor:pointer}
/* ===== 3 分栏浏览 ===== */
.v3{width:900px;height:580px}
.v3 .c1,.v3 .c2,.v3 .c3{position:absolute;top:0;bottom:0;overflow:auto}
.v3 .c1{left:0;width:170px;padding:50px 10px 10px;background:var(--desk)}
.v3 .c2{left:170px;width:260px;padding:50px 10px 10px;border-right:.5px solid var(--line);background:color-mix(in srgb,var(--card) 50%,var(--bg))}
.v3 .c3{left:430px;right:0;padding:50px 36px 30px}
.v3 .it{display:flex;align-items:center;gap:9px;min-height:32px;padding:5px 10px;border-radius:8px;cursor:pointer}
.v3 .it .v{margin-left:auto;font-size:11.5px;color:var(--t3);white-space:nowrap}
.v3 .it .chev{color:var(--t3);width:11px;height:11px}
.v3 .it.on{background:var(--fill);color:var(--on)}.v3 .it.on .v,.v3 .it.on .chev,.v3 .it.on .ico{color:inherit;opacity:.85}
.v3 .it.half{background:var(--wash)}
.v3 .c3 .kick{font-size:11.5px;color:var(--t3)}
.v3 .c3 h2{margin:4px 0 8px;font-size:24px}
.v3 .c3 .desc{margin:0 0 22px;font-size:13px;line-height:1.7;color:var(--t2);max-width:400px}
.v3 .opts{display:flex;flex-direction:column;gap:8px;max-width:400px}
.v3 .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--card);box-shadow:var(--sh);cursor:pointer}
.v3 .opt i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);flex:none}
.v3 .opt.on{box-shadow:0 0 0 1.5px var(--fill)}.v3 .opt.on i{box-shadow:inset 0 0 0 5px var(--fill)}
.v3 .bigsl{display:flex;align-items:center;gap:14px;max-width:400px}.v3 .bigsl input{flex:1;accent-color:var(--fill)}.v3 .bigsl b{font-size:26px;font-weight:600;min-width:70px;text-align:right}
.v3 .c3 .sample{margin-top:22px;max-width:400px;max-height:170px;overflow:hidden;border-radius:12px;padding:16px 20px;box-shadow:var(--sh)}
.v3 .keys{position:absolute;right:16px;bottom:12px;font-size:11px;color:var(--t3)}
/* ===== 4 一张清单 ===== */
.v4{width:720px;height:620px}
.v4 .top{position:absolute;left:0;right:0;top:0;padding:46px 30px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:3;box-shadow:inset 0 -.5px 0 var(--line)}
.v4 .q{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:12px;background:var(--card);box-shadow:var(--sh)}
.v4 .q input{flex:1;border:0;outline:0;background:none;font:15px var(--sans);color:var(--t1)}
.v4 .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.v4 .chips span{height:26px;padding:0 10px;border-radius:13px;display:flex;align-items:center;gap:5px;background:var(--inset);font-size:12px;color:var(--t2);cursor:pointer}
.v4 .chips span em{font-style:normal;font-size:10.5px;opacity:.7}
.v4 .chips span.on{background:var(--fill);color:var(--on)}
.v4 .lst{position:absolute;left:0;right:0;top:150px;bottom:0;overflow:auto;padding:6px 30px 30px}
.v4 .sec{position:sticky;top:0;z-index:1;padding:12px 2px 6px;font-size:11.5px;font-weight:600;color:var(--t2);background:var(--bg)}
.v4 .card{padding:0 16px;border-radius:12px;background:var(--card);box-shadow:var(--sh)}
.v4 mark{background:color-mix(in srgb,var(--fill) 18%,transparent);color:inherit;border-radius:2px}
.v4 .none{padding:50px 0;text-align:center;color:var(--t3)}
/* ===== 5 体检 ===== */
.v5{width:760px;height:620px}
.v5 .in{position:absolute;inset:0;overflow:auto;padding:50px 40px 30px}
.v5 h2{margin:0;font-size:26px;letter-spacing:-.01em}
.v5 .sum{margin:6px 0 22px;font-size:13px;color:var(--t2)}
.v5 .todo{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.v5 .td{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:var(--card);box-shadow:0 0 0 1px var(--soft),var(--sh);animation:in .35s var(--sp)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.v5 .td .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--accent);flex:none}
.v5 .td .n .ico{width:16px;height:16px}
.v5 .td b{display:block;font-size:13.5px}.v5 .td small{display:block;margin-top:2px;font-size:12px;color:var(--t2)}
.v5 .gh{margin:0 2px 8px;font-size:12px;font-weight:600;color:var(--t2)}
.v5 .ok-l{border-radius:14px;background:var(--card);box-shadow:var(--sh);overflow:hidden}
.v5 .okr{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-top:.5px solid var(--line);cursor:pointer}
.v5 .okr:first-child{border-top:0}
.v5 .okr .ico{color:var(--t2)}.v5 .okr em{margin-left:auto;font-style:normal;font-size:12px;color:var(--t3)}
.v5 .okr .chk{width:16px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);display:grid;place-items:center;font-size:10px;flex:none}
.v5 .okr .chev{width:11px;height:11px;color:var(--t3);transition:transform .25s}
.v5 .okr.open .chev{transform:rotate(90deg)}
.v5 .exp{padding:0 16px 6px 44px;background:color-mix(in srgb,var(--bg) 50%,var(--card))}
.v5 .done{display:flex;align-items:center;gap:10px;padding:16px 18px;border-radius:14px;background:color-mix(in srgb,var(--ok) 9%,var(--card));color:var(--ok);font-size:13px;margin-bottom:26px}
/* ===== 6 大舞台 ===== */
.v6{width:900px;height:620px;background:var(--desk)}
.v6 .st{position:absolute;left:0;right:0;top:0;height:360px;display:grid;place-items:center;overflow:hidden;transition:background-color .35s}
.v6 .st .sample{width:440px;height:280px;margin-top:28px;border-radius:6px;padding:26px 34px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 20px 44px rgba(51,46,41,.16)}
.v6 .wave{display:flex;align-items:center;gap:3px;height:80px}
.v6 .wave i{width:4px;border-radius:2px;background:var(--fill);animation:wv 1.1s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.35)}}
.v6 .bubble{max-width:420px;padding:14px 16px;border-radius:16px;background:var(--card);box-shadow:var(--lift);font-size:13px;line-height:1.7}
.v6 .bar{position:absolute;left:0;right:0;top:360px;bottom:0;background:var(--bg);box-shadow:0 -.5px 0 var(--line)}
.v6 .tabs{display:flex;justify-content:center;gap:4px;padding:12px 0 10px}
.v6 .tabs span{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;font-size:12.5px;color:var(--t2);cursor:pointer}
.v6 .tabs span.on{background:var(--fill);color:var(--on)}
.v6 .strip{display:flex;gap:10px;padding:6px 24px 20px;overflow-x:auto}
.v6 .cell{flex:none;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-width:150px;height:122px;padding:14px;border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.v6 .cell .lab b{font-weight:600;font-size:12.5px}
.v6 .cell .seg{flex-wrap:wrap}
/* ===== 7 书上的浮层 ===== */
.v7{width:900px;height:620px}
.v7 .tb{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 16px;box-shadow:inset 0 -.5px 0 color-mix(in srgb,var(--pi) 12%,transparent);background:var(--pb);color:var(--pi)}
.v7 .tb span{width:32px;height:28px;border-radius:8px;display:grid;place-items:center;font:600 13px var(--serif);cursor:pointer}
.v7 .tb span.on{background:color-mix(in srgb,var(--pi) 12%,transparent)}
.v7 .bk{position:absolute;left:0;right:0;top:52px;bottom:0;padding:50px 200px 0 120px;overflow:hidden}
.v7 .pop{position:absolute;right:14px;top:58px;width:340px;max-height:548px;border-radius:16px;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 22px 50px rgba(0,0,0,.2);overflow:hidden;transform-origin:calc(100% - 24px) 0;animation:pop .28s var(--sp)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.v7 .pop::before{content:"";position:absolute;right:22px;top:-6px;width:12px;height:12px;transform:rotate(45deg);background:var(--card)}
.v7 .lvl{display:flex;width:200%;transition:transform .35s var(--sp)}
.v7 .lvl.deep{transform:translateX(-50%)}
.v7 .lvl>div{width:50%;max-height:548px;overflow:auto;padding:12px}
.v7 .mod{border-radius:12px;background:var(--bg);margin-bottom:8px;overflow:hidden}
.v7 .mod>b{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;font-size:13px;cursor:pointer}
.v7 .mod>b em{margin-left:auto;font-style:normal;font-weight:400;font-size:11.5px;color:var(--t3)}
.v7 .mod>b .ico{color:var(--accent)}
.v7 .mod .body{padding:0 12px 6px}
.v7 .mod .row{min-height:40px}
.v7 .mod .sl input{width:110px}
.v7 .more{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px;border-radius:12px;font-size:13px;cursor:pointer;color:var(--accent)}
.v7 .back{display:flex;align-items:center;gap:4px;height:32px;margin-bottom:6px;font-size:13px;color:var(--accent);cursor:pointer}
/* ===== 8 检查器表格 ===== */
.v8{width:860px;height:600px}
.v8 .tbl{position:absolute;left:0;top:0;bottom:0;width:560px;overflow:auto;padding-top:44px}
.v8 .th{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:200px 1fr 70px 30px;height:28px;align-items:center;padding:0 14px;background:var(--bg);box-shadow:inset 0 -.5px 0 var(--line);font-size:11px;font-weight:600;color:var(--t3)}
.v8 .gp{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--t1) 4%,var(--bg));cursor:pointer;position:sticky;top:28px;z-index:1}
.v8 .gp .chev{width:10px;height:10px;transition:transform .2s;color:var(--t3)}
.v8 .gp.open .chev{transform:rotate(90deg)}
.v8 .tr{display:grid;grid-template-columns:200px 1fr 70px 30px;align-items:center;min-height:34px;padding:0 14px;font-size:12.5px;cursor:default}
.v8 .tr:nth-child(odd){background:color-mix(in srgb,var(--t1) 2.5%,transparent)}
.v8 .tr.sel{background:var(--soft)}
.v8 .tr .nm{padding-left:14px}
.v8 .tr.ch .nm{font-weight:600}
.v8 .tr .df{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.v8 .tr .rs{width:20px;height:20px;border-radius:10px;border:0;background:none;color:var(--accent);cursor:pointer;font-size:13px}
.v8 .tr .seg button{height:20px;padding:0 7px;font-size:11px}
.v8 .tr .tg{transform:scale(.85);transform-origin:left center}
.v8 .tr .sl input{width:110px}
.v8 .tr .dots i{width:16px;height:16px}
.v8 .side{position:absolute;left:560px;right:0;top:0;bottom:0;padding:50px 24px 20px;border-left:.5px solid var(--line);background:color-mix(in srgb,var(--card) 45%,var(--bg))}
.v8 .side .kick{font-size:11px;color:var(--t3)}.v8 .side h3{margin:4px 0 8px;font-size:17px}
.v8 .side p{margin:0 0 16px;font-size:12.5px;line-height:1.7;color:var(--t2)}
.v8 .side .sample{border-radius:10px;padding:14px 16px;max-height:220px;overflow:hidden;box-shadow:var(--sh)}
.v8 .side dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:12px}.v8 .side dt{color:var(--t3)}.v8 .side dd{margin:0}
/* 切换条：照 prototype 规范原样 */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}

var picker=document.querySelector('.proto-picker'),hl=picker.querySelector('.proto-picker-highlight'),pitems=[].slice.call(picker.querySelectorAll('.proto-picker-item'));
