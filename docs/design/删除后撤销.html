<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>语阅 · 删除后撤销选稿</title>
<style>
/* A review sheet: the same 书架 in every phone, only the undo differs. Colours are the prototype's (v0.29). */
:root{--bg:#F6F5F3;--card:#FFFFFF;--inset:#EFEEEB;--line:#E7E5E1;--t1:#2A2B2E;--t2:#85827F;--t3:#A8A49F;
  --accent:#2B4C7E;--on-accent:#fff;--danger:#C2473A;--glass:rgba(255,255,255,.86);--sheet:#EEEDEA;--ink:#141517;--on-ink:#F4F3F0;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;--serif:"Songti SC","Noto Serif SC",serif;
  --sh:0 8px 24px rgba(0,0,0,.09),0 0 0 .5px var(--line)}
:root[data-theme="dark"]{--bg:#101112;--card:#1B1C1E;--inset:#26272A;--line:#2C2D30;--t1:#EDEDEE;--t2:#9A9895;--t3:#75726E;
  --accent:#8FA8C8;--on-accent:#101214;--danger:#E0685A;--glass:rgba(36,37,40,.84);--sheet:#0A0A0B;--ink:#F1F0EC;--on-ink:#141517;
  --sh:0 10px 30px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.08);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--sheet);color:var(--t1);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:40px 20px 90px;display:flex;flex-direction:column;gap:30px}
h1{margin:0;font-family:var(--serif);font-size:30px;letter-spacing:.02em}
.lead{margin:8px 0 0;color:var(--t2);line-height:1.8;font-size:14.5px;max-width:64em}
.bar{position:sticky;top:12px;z-index:50;align-self:flex-start;display:flex;gap:6px;padding:5px;border-radius:14px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--sh)}
.bar button{font:inherit;font-size:13px;border:0;border-radius:10px;padding:7px 13px;background:none;color:var(--t2);cursor:pointer}
.bar button.on{background:var(--card);color:var(--t1);font-weight:600;box-shadow:0 0 0 .5px var(--line)}
.bar .sep{width:1px;background:var(--line);margin:4px 2px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 28px}
@media (max-width:1060px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}}
figure{margin:0;display:flex;flex-direction:column;gap:14px;align-items:center}
figcaption{width:100%;max-width:330px;font-size:13px;line-height:1.75;color:var(--t2)}
figcaption b{display:flex;align-items:center;gap:8px;color:var(--t1);font-size:15.5px;margin-bottom:4px}
figcaption b i{font-style:normal;font-size:11px;font-weight:600;padding:1px 8px;border-radius:9px;background:var(--inset);color:var(--t2)}
figcaption ul{margin:6px 0 0;padding-left:1.1em}
figcaption li{margin:2px 0}
/* ---- the phone, drawn at the prototype's own pixels (a real point is 1.2 of these) ---- */
.phone{position:relative;width:330px;aspect-ratio:9/19.5;border-radius:40px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(51,46,41,.1);font-size:11px;color:var(--t1);isolation:isolate}
.st{display:flex;justify-content:space-between;padding:14px 26px 0;font-size:12px;font-weight:600;height:40px}
.st i{width:22px;height:11px;border-radius:3px;border:1px solid currentColor;opacity:.8;position:relative}
.st i::after{content:"";position:absolute;inset:1.5px;right:4px;background:currentColor;border-radius:1px}
.ttl{text-align:center;font-size:13px;font-weight:600;padding:6px 0 10px}
.chips{display:flex;gap:6px;padding:0 16px 12px;align-items:center}
.chips span{height:26px;padding:0 11px;border-radius:13px;display:grid;place-items:center;font-size:11px;color:var(--t2);background:var(--card);box-shadow:0 0 0 .5px var(--line)}
.chips span.on{background:var(--accent);color:var(--on-accent);box-shadow:none;font-weight:600}
.chips em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--t2)}
.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 14px;padding:0 16px}
.bk{display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.cv{display:block;width:100%;aspect-ratio:2/3;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12),0 4px 10px rgba(30,30,30,.13)}
.cv svg{display:block;width:100%;height:100%}
.bk b{font-size:11px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk small{font-size:10px;color:var(--t3)}
/* the iPhone glass tab bar */
.tabs{position:absolute;left:14px;right:14px;bottom:20px;height:60px;display:flex;gap:8px;z-index:5}
.tabs .tb{flex:1;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:30px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--sh)}
.tabs .tb span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:26px;font-size:10px;font-weight:500}
.tabs .tb span.on{background:color-mix(in srgb,var(--t1) 7%,transparent);color:var(--accent);font-weight:600}
.tabs .sq{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--sh)}
.tabs svg{width:24px;height:24px}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mini{width:22px;height:33px;border-radius:2.5px;overflow:hidden;flex:none;box-shadow:0 0 0 .5px rgba(0,0,0,.15),0 2px 5px rgba(0,0,0,.18)}
.mini svg{display:block;width:100%;height:100%}
/* countdown: every option that has one runs it for the app's 8 seconds */
@keyframes drain{from{stroke-dashoffset:0}to{stroke-dashoffset:var(--len)}}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes up{from{transform:translateY(22px) scale(.96);opacity:0}}
@keyframes down{from{transform:translateY(-18px) scale(.96);opacity:0}}
@keyframes fade{from{opacity:0}}
.go .anim-up{animation:up .42s cubic-bezier(.2,.9,.25,1.15) both}
.go .anim-down{animation:down .42s cubic-bezier(.2,.9,.25,1.15) both}
.go .ring circle.r{animation:drain 8s linear .4s both}
.go .line i{animation:shrink 8s linear .4s both}
.line{position:absolute;height:2px;border-radius:1px;overflow:hidden;background:color-mix(in srgb,currentColor 12%,transparent)}
.line i{display:block;height:100%;background:currentColor;transform-origin:left}

/* 0 · 现在：即刻样式，顶上灰胶囊 */
.o0{position:absolute;top:46px;left:50%;transform:translateX(-50%);z-index:9;height:38px;padding:0 20px;border-radius:19px;display:flex;align-items:center;gap:9px;white-space:nowrap;background:#E9E9E9;color:#333;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
:root[data-theme="dark"] .o0{background:#333;color:#EBEBEB}
.o0 .dot{width:14px;height:14px;border-radius:50%;background:var(--danger);display:grid;place-items:center;color:#fff}
.o0 .dot .ico{width:9px;height:9px;stroke-width:2.4}
.o0 a{color:var(--accent);font-weight:500}
.go .o0{animation:down .4s cubic-bezier(.2,.9,.25,1.15) both}

/* 1 · 墨色胶囊 + 倒计时圈 */
.o1{position:absolute;left:14px;right:14px;bottom:90px;z-index:9;height:54px;border-radius:27px;display:flex;align-items:center;gap:10px;padding:0 7px 0 16px;background:var(--ink);color:var(--on-ink);box-shadow:0 14px 34px -10px rgba(0,0,0,.45)}
.o1 .tx{flex:1;min-width:0;line-height:1.3}
.o1 .tx b{display:block;font-size:12.5px;font-weight:600}
.o1 .tx small{display:block;font-size:10px;opacity:.55}
.o1 .u{display:flex;align-items:center;gap:7px;height:40px;padding:0 4px 0 14px;border-radius:20px;background:color-mix(in srgb,var(--on-ink) 12%,transparent);font-size:12.5px;font-weight:600}
.ring{width:32px;height:32px;position:relative;display:grid;place-items:center}
.ring svg.c{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2;stroke-linecap:round}
.ring circle.bg{stroke:color-mix(in srgb,currentColor 18%,transparent)}
.ring circle.r{stroke:currentColor;stroke-dasharray:var(--len);--len:81.7}
.ring .ico{width:13px;height:13px;stroke-width:2}

/* 2 · 原位留影 */
.ghost .cv{filter:grayscale(1);opacity:.28}
.ghost::before{content:"";position:absolute;left:-4px;right:-4px;top:-4px;aspect-ratio:2/3;height:auto;border-radius:6px;border:1.2px dashed color-mix(in srgb,var(--t3) 80%,transparent);width:calc(100% + 8px)}
.ghost .gb{position:absolute;left:50%;top:calc((100% - 30px)/2 - 14px);transform:translateX(-50%);display:flex;align-items:center;gap:5px;height:30px;padding:0 12px 0 10px;border-radius:15px;background:var(--card);color:var(--t1);font-size:11.5px;font-weight:600;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.14),0 0 0 .5px var(--line)}
.ghost .gb .ico{width:12px;height:12px;stroke-width:2;color:var(--accent)}
.ghost b{color:var(--t3)}
.ghost small{color:var(--danger)!important}
.ghost .line{left:0;right:0;bottom:-7px;color:var(--t3)}
.go .ghost .gb{animation:fade .3s ease both .15s}

/* 3 · 白卡片，封面斜着落进来 */
.o3{position:absolute;left:12px;right:12px;bottom:92px;z-index:9;height:74px;border-radius:22px;display:flex;align-items:center;gap:13px;padding:0 10px 0 18px;background:var(--card);box-shadow:0 18px 40px -12px rgba(30,28,24,.28),0 0 0 .5px var(--line);overflow:hidden}
.o3 .mini{width:30px;height:45px;border-radius:3px;transform:rotate(-7deg) translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.o3 .tx{flex:1;min-width:0;line-height:1.35}
.o3 .tx b{display:block;font-size:13px;font-weight:600}
.o3 .tx small{display:block;font-size:10.5px;color:var(--t2)}
.o3 .u{height:36px;padding:0 16px;border-radius:18px;background:var(--accent);color:var(--on-accent);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.o3 .u .ico{width:13px;height:13px;stroke-width:2}
.o3 .line{left:22px;right:22px;bottom:0;color:var(--accent)}
@keyframes drop{0%{transform:translate(70px,-150px) rotate(14deg) scale(1.9);opacity:0}60%{opacity:1}100%{transform:rotate(-7deg) translateY(-3px)}}
.go .o3 .mini{animation:drop .6s cubic-bezier(.2,.8,.3,1.1) both .1s}

/* 4 · 从摄像头那儿长出来 */
.o4{position:absolute;top:10px;left:50%;z-index:9;width:300px;margin-left:-150px;height:56px;border-radius:28px;background:#000;color:#F2F2F2;display:flex;align-items:center;gap:11px;padding:0 8px 0 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.o4 .mini{width:24px;height:36px;border-radius:4px}
.o4 .tx{flex:1;min-width:0;line-height:1.3}
.o4 .tx b{display:block;font-size:12.5px;font-weight:600}
.o4 .tx small{display:block;font-size:10px;color:#8E8E93}
.o4 .u{height:40px;padding:0 15px;border-radius:20px;background:#2C2C2E;color:#9DB8E0;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.o4 .u .ico{width:13px;height:13px;stroke-width:2}
.o4 .line{left:30px;right:30px;bottom:5px;color:#9DB8E0;height:1.5px}
@keyframes island{0%{width:110px;margin-left:-55px;height:34px;border-radius:17px}100%{width:300px;margin-left:-150px;height:56px}}
@keyframes islandin{0%,45%{opacity:0}}
.go .o4{animation:island .5s cubic-bezier(.25,.9,.25,1.12) both}
.go .o4>*{animation:islandin .55s ease both}
.isl{position:absolute;top:13px;left:50%;width:100px;margin-left:-50px;height:30px;border-radius:15px;background:#000;z-index:8}

/* 5 · 书架顶上多一行，不计时 */
.o5{margin:0 16px 14px;height:46px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;background:color-mix(in srgb,var(--danger) 7%,var(--card));box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--danger) 22%,transparent)}
.o5 .mini{width:18px;height:27px}
.o5 .tx{flex:1;min-width:0;font-size:12px;line-height:1.3}
.o5 .tx small{display:block;font-size:10px;color:var(--t2)}
.o5 .u{height:32px;padding:0 13px;border-radius:16px;background:var(--card);color:var(--accent);font-size:12px;font-weight:600;display:flex;align-items:center;box-shadow:0 0 0 .5px var(--line),0 1px 2px rgba(0,0,0,.05)}
.o5 .x{width:28px;height:28px;display:grid;place-items:center;color:var(--t3)}
.o5 .x .ico{width:12px;height:12px}
@keyframes open{from{height:0;margin-bottom:0;opacity:0}}
.go .o5{animation:open .35s cubic-bezier(.2,.8,.3,1) both}

/* 6 · 不弹条：进"最近删除" */
.hd6{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px}
.hd6 h3{margin:0;font-size:24px;font-weight:700;font-family:var(--serif)}
.bin{position:relative;height:30px;display:flex;align-items:center;gap:5px;padding:0 11px 0 9px;border-radius:15px;background:var(--card);box-shadow:0 0 0 .5px var(--line),0 1px 3px rgba(0,0,0,.05);font-size:11px;color:var(--t2)}
.bin .ico{width:13px;height:13px}
.bin em{font-style:normal;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pop{position:absolute;top:118px;right:12px;width:240px;z-index:9;border-radius:18px;background:var(--card);box-shadow:0 20px 44px -10px rgba(30,28,24,.3),0 0 0 .5px var(--line);padding:6px}
.pop::before{content:"";position:absolute;top:-6px;right:34px;width:12px;height:12px;background:var(--card);transform:rotate(45deg);box-shadow:-.5px -.5px 0 var(--line)}
.pop .h{padding:8px 10px 6px;font-size:11px;color:var(--t2);display:flex;justify-content:space-between}
.pop .row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px}
.pop .row+.row{box-shadow:inset 0 .5px 0 var(--line)}
.pop .row .mini{width:24px;height:36px}
.pop .row .tx{flex:1;min-width:0;line-height:1.35}
.pop .row .tx b{display:block;font-size:12px;font-weight:600}
.pop .row .tx small{font-size:10px;color:var(--t3)}
.pop .row .u{height:28px;padding:0 11px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-size:11px;font-weight:600;display:flex;align-items:center}
.pop .f{padding:6px 10px 8px;font-size:10px;color:var(--t3)}
@keyframes popin{from{transform:translateY(-6px) scale(.96);opacity:0}}
.go .pop{animation:popin .3s cubic-bezier(.2,.9,.3,1.1) both .2s;transform-origin:85% 0}
.fly{position:absolute;z-index:10;width:26px;height:39px;top:56px;right:42px;border-radius:3px;overflow:hidden;opacity:0}
@keyframes fly{0%{transform:translate(-120px,180px) scale(3.4) rotate(-8deg);opacity:1}85%{opacity:1}100%{transform:none;opacity:0}}
.go .fly{animation:fly .6s cubic-bezier(.5,0,.3,1) both}

/* 7 · 只有一颗"撤销"，倒计时就是它的底色 */
.o7{position:absolute;left:50%;bottom:94px;z-index:9;transform:translateX(-50%);height:44px;border-radius:22px;display:flex;align-items:center;gap:8px;padding:0 18px 0 8px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--sh);overflow:hidden;white-space:nowrap;font-size:12.5px}
.o7 .fill{position:absolute;inset:0;background:color-mix(in srgb,var(--accent) 13%,transparent);transform-origin:left}
.go .o7 .fill{animation:shrink 8s linear .4s both}
.o7>*:not(.fill){position:relative}
.o7 .mini{width:20px;height:30px;margin-left:4px}
.o7 b{font-weight:600}
.o7 a{color:var(--accent);font-weight:600;display:flex;align-items:center;gap:4px}
.o7 a .ico{width:13px;height:13px;stroke-width:2}
.go .o7{animation:up7 .42s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes up7{from{transform:translate(-50%,22px) scale(.94);opacity:0}}

/* 8 · 连删几本也只一条：封面摞起来 */
.o8{position:absolute;left:14px;right:14px;bottom:90px;z-index:9;height:58px;border-radius:29px;display:flex;align-items:center;gap:12px;padding:0 8px 0 12px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);box-shadow:0 12px 32px -8px rgba(0,0,0,.2),0 0 0 .5px var(--line)}
.one{position:relative;flex:none;width:26px;height:39px;margin:0 4px 0 2px}
.one .mini{width:26px;height:39px}
.one em{position:absolute;top:-6px;right:-9px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--danger);color:#fff;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}
.o8 .tx{flex:1;min-width:0;line-height:1.3}
.o8 .tx b{display:block;font-size:12.5px;font-weight:600}
.o8 .tx small{display:block;font-size:10px;color:var(--t2)}
.o8 .u{display:flex;align-items:center;gap:6px;height:42px;padding:0 6px 0 14px;border-radius:21px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600}
.o8 .ring{width:30px;height:30px}
.o8 .ring circle.r{--len:75.4}
@keyframes pop8{0%{transform:scale(0)}70%{transform:scale(1.25)}}
.go .one em{animation:pop8 .35s ease-out both .35s}
.dim .cv{opacity:.92}
.pick{position:absolute;inset:-3px;border-radius:5px;box-shadow:0 0 0 2px var(--accent)}
.note{font-size:12.5px;color:var(--t2);line-height:1.8;background:var(--card);border-radius:14px;padding:14px 18px;box-shadow:0 0 0 .5px var(--line)}
.note b{color:var(--t1)}
