<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置窗口 · 新 UI</title>
<style>
/* 颜色、圆角、时长全取自 apple/Yuyue/Design/Tokens.swift 和书架窗口（MacShelfView.swift 的 ShelfDesk） */
:root{
  --bg:#F6F5F3;--card:#FFFFFF;--inset:#EFEEEB;--line:#E7E5E1;--t1:#2A2B2E;--t2:#6E6B68;--t3:#8A8682;
  --ok:#3E9B6A;--danger:#C2473A;--accent:#2B4C7E;--fill:#2B4C7E;--on-fill:#FFFFFF;--soft:rgba(43,76,126,.12);
  --desk:#EAE8E3;--wash:rgba(42,43,46,.07);--field:rgba(0,0,0,.05);
  --paper-edge:0 0 0 .5px rgba(0,0,0,.07),0 1px 3px rgba(51,46,41,.06),0 8px 24px rgba(51,46,41,.06);
  --card-sh:0 0 0 .5px rgba(0,0,0,.05),0 1px 2px rgba(51,46,41,.04);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;--serif:"Songti SC","Noto Serif SC",STSong,serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  --quick:.14s;--std:.24s;--layout:.35s;--spring:cubic-bezier(.2,.9,.25,1);color-scheme:light}
:root[data-theme="dark"]{
  --bg:#101112;--card:#1B1C1E;--inset:#26272A;--line:#2C2D30;--t1:#EDEDEE;--t2:#9A9895;--t3:#8E8C89;
  --ok:#5DBB88;--danger:#E5806F;--accent:#8FA8C8;--fill:#8FA8C8;--on-fill:#101214;--soft:rgba(143,168,200,.16);
  --desk:#0C0C0D;--wash:rgba(255,255,255,.08);--field:rgba(255,255,255,.06);
  --paper-edge:0 0 0 .5px rgba(255,255,255,.07),0 8px 24px rgba(0,0,0,.4);--card-sh:0 0 0 .5px rgba(255,255,255,.06);color-scheme:dark}
:root[data-tint="ink"]{--fill:#101214;--on-fill:#FFFFFF}
:root[data-theme="dark"][data-tint="ink"]{--fill:#EDEDEE;--on-fill:#101214}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#DCD9D2;font-family:var(--sans);color:var(--t1);-webkit-font-smoothing:antialiased}
:root[data-theme="dark"] body{background:#050506}
.top{display:flex;justify-content:center;gap:10px;padding:26px 16px 0;flex-wrap:wrap}
.top .seg{background:rgba(255,255,255,.55)}
:root[data-theme="dark"] .top .seg{background:rgba(255,255,255,.08)}
.stage{display:flex;justify-content:center;padding:22px 16px 60px;overflow-x:auto}
.note{max-width:860px;margin:0 auto;padding:0 16px 60px;font-size:13px;line-height:1.75;color:#5f5c58}
:root[data-theme="dark"] .note{color:#9a9895}
.note b{color:inherit}

/* ===== 窗口：书架窗口那种——桌面色上的导航，右边一张纸 ===== */
.win{position:relative;width:880px;height:620px;flex:none;border-radius:12px;overflow:hidden;background:var(--desk);box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 30px 70px rgba(51,46,41,.2);font-size:13px}
.lights{position:absolute;left:18px;top:18px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.ico{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 导航 */
.nav{position:absolute;left:0;top:0;bottom:0;width:208px;padding:50px 12px 12px;display:flex;flex-direction:column}
.search{position:relative;display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:9px;background:var(--field);color:var(--t2)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font:12.5px var(--sans);color:var(--t1)}
.search input::placeholder{color:var(--t2)}
.search kbd{font:10.5px var(--sans);color:var(--t3)}
.search:focus-within{background:var(--card);box-shadow:0 0 0 .5px var(--line),0 0 0 3px var(--soft)}
.list{flex:1;min-height:0;overflow:auto;margin-top:6px;scrollbar-width:none}
.gt{margin:14px 10px 4px;font-size:11px;font-weight:600;color:var(--t3)}
.it{position:relative;display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;color:var(--t1);cursor:pointer;transition:background-color var(--quick) ease-out}
.it .ico{color:var(--t2);transition:color var(--quick)}
.it:hover{background:color-mix(in srgb,var(--wash) 55%,transparent)}
.it.on{background:var(--wash);font-weight:600}.it.on .ico{color:var(--t1)}
.it .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;transform:scale(.4);transition:opacity var(--std),transform var(--std) var(--spring)}
.it.ed .dot{opacity:1;transform:none}
.foot{display:flex;align-items:center;justify-content:space-between;min-height:30px;padding:0 10px;font-size:11.5px;color:var(--t3)}
.foot a{color:var(--accent);cursor:pointer}
.res{position:absolute;left:12px;top:86px;width:280px;z-index:9;padding:6px;border-radius:12px;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px var(--line),0 14px 36px rgba(0,0,0,.16)}
.res[hidden]{display:none}
.res div{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:7px;cursor:pointer}
.res div .ico{color:var(--t2)}
.res div em{margin-left:auto;font-style:normal;font-size:11px;color:var(--t3)}
.res div.on{background:var(--fill);color:var(--on-fill)}.res div.on .ico,.res div.on em{color:inherit;opacity:.85}
.res mark{background:none;color:inherit;font-weight:700}
.res p{margin:8px 10px;font-size:12px;color:var(--t3)}

/* 纸 */
.paper{position:absolute;left:208px;top:8px;right:8px;bottom:8px;border-radius:12px;background:var(--bg);box-shadow:var(--paper-edge);overflow:hidden}
.scroll{position:absolute;inset:0;overflow:auto;padding:0 32px 40px;scrollbar-width:thin}
.page{display:grid;grid-template-columns:minmax(0,1fr);column-gap:28px;align-items:start;max-width:600px}
.page.with{grid-template-columns:minmax(0,1fr) 236px;max-width:none}
.page.in{animation:pin var(--std) ease-out}
@keyframes pin{from{opacity:0;transform:translateY(6px)}}
.hd{grid-column:1/-1;padding:40px 0 22px}
.hd h1{margin:0;font-size:22px;font-weight:700;line-height:28px;letter-spacing:-.01em}
.hd p{margin:6px 0 0;font-size:12.5px;line-height:1.6;color:var(--t2)}
.col{display:flex;flex-direction:column;min-width:0}
.gh{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 8px;font-size:12px;font-weight:600;color:var(--t2)}
.gh em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--t3)}
.group{margin-bottom:24px}
.card{border-radius:12px;background:var(--card);box-shadow:var(--card-sh);padding:0 16px}
.row{position:relative;display:flex;align-items:center;gap:16px;min-height:48px;padding:11px 0}
.row+.row::before,.row+.open::before,.open+.row::before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--line)}
.row.c{min-height:42px;padding:8px 0}
.row.st{flex-wrap:wrap;gap:12px 16px;padding:14px 0}.row.st>.lab{flex-basis:100%}
.lab{flex:1;min-width:0;line-height:1.4}
.lab b{display:block;font-weight:400;font-size:13px}
.lab small{display:block;margin-top:2px;font-size:11.5px;line-height:1.5;color:var(--t3)}
.lab small.ok{color:var(--ok)}.lab small.bad{color:var(--danger)}
.lab .reset{margin-left:6px;color:var(--accent);cursor:pointer;font-size:11.5px}
.row.flash::after{content:"";position:absolute;inset:0 -10px;border-radius:9px;background:var(--soft);z-index:-1;animation:fl 1.6s ease-out forwards}
.row{isolation:isolate}
@keyframes fl{0%,40%{opacity:1}to{opacity:0}}
.pgfoot{margin:-6px 4px 0;font-size:11.5px;color:var(--t3)}
.pgfoot a{color:var(--accent);cursor:pointer}

/* 控件：照 App 的开关、分段、滑杆、按钮，做得更从容一点 */
.tg{position:relative;width:32px;height:20px;border-radius:10px;background:var(--inset);box-shadow:inset 0 0 0 .5px var(--line);flex:none;cursor:pointer;transition:background-color var(--std)}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform var(--std) var(--spring)}
.tg.on{background:var(--fill);box-shadow:none}.tg.on::after{transform:translateX(12px)}
:root[data-theme="dark"][data-tint="ink"] .tg.on::after{background:#101214}
.seg{position:relative;display:inline-flex;padding:2px;border-radius:9px;background:var(--inset);flex:none}
.seg .th{position:absolute;top:2px;bottom:2px;left:0;border-radius:7px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 .5px var(--line);transition:transform var(--std) var(--spring),width var(--std) var(--spring)}
.seg button{position:relative;height:24px;padding:0 11px;border:0;background:none;font:12px var(--sans);color:var(--t2);cursor:pointer;white-space:nowrap;transition:color var(--quick)}
.seg button.on{color:var(--t1);font-weight:600}
.sl{display:flex;align-items:center;gap:12px;flex:none}
.sl input{-webkit-appearance:none;appearance:none;width:160px;height:20px;background:none;cursor:pointer}
.sl input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--fill),var(--fill)) 0/var(--p,50%) 100% no-repeat,var(--inset)}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.24)}
.sl b{min-width:36px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.btn{height:26px;padding:0 12px;border:0;border-radius:13px;background:var(--inset);font:500 12px var(--sans);color:var(--t1);cursor:pointer;white-space:nowrap;flex:none;transition:transform var(--quick) ease-out,background-color var(--quick)}
.btn:active{transform:scale(.96)}
.btn.k{background:var(--fill);color:var(--on-fill)}
.btn.r{background:color-mix(in srgb,var(--danger) 11%,transparent);color:var(--danger)}
.btn.t{background:none;color:var(--accent);padding:0 4px}
.btn:disabled{opacity:.55;cursor:default}
.sel{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px 0 11px;border-radius:7px;background:var(--card);box-shadow:0 0 0 .5px var(--line),0 1px 2px rgba(0,0,0,.05);font-size:12.5px;cursor:pointer;flex:none}
.sel .ico{width:11px;height:11px;color:var(--t3)}
.kbd{font-size:12px;color:var(--t2)}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.papers{display:flex;gap:10px;flex:none}
.papers span{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--t2);cursor:pointer}
.papers i{width:38px;height:30px;border-radius:7px;display:grid;place-items:center;font:14px var(--serif);font-style:normal;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14);transition:box-shadow var(--std)}
.papers span.on{color:var(--t1);font-weight:600}.papers span.on i{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14),0 0 0 2px var(--card),0 0 0 3.5px var(--fill)}
.themes{display:flex;gap:12px;flex:none}
.themes span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--t2);cursor:pointer}
.themes i{width:66px;height:44px;border-radius:7px;box-shadow:0 0 0 .5px rgba(128,128,128,.45);background:linear-gradient(90deg,var(--a) 0 32%,var(--b) 32%)}
.themes span.on{color:var(--t1);font-weight:600}.themes span.on i{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--fill)}
.tints{display:flex;gap:12px;flex:none}
.tints span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--t2);cursor:pointer}
.tints i{width:22px;height:22px;border-radius:50%}
.tints span.on{color:var(--t1);font-weight:600}.tints span.on i{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--t2)}
.lg{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--inset);font-size:12px;font-weight:600;color:var(--t2);flex:none}
.open{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--layout) var(--spring)}
.open>div{overflow:hidden}
.open.on{grid-template-rows:1fr}
.keyf{display:flex;gap:8px;padding:2px 0 14px 44px}
.keyf input{flex:1;height:32px;padding:0 10px;border:0;border-radius:8px;background:var(--inset);font:12.5px var(--mono);color:var(--t1);outline:0}
.keyf input:focus{box-shadow:0 0 0 3px var(--soft)}
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.way{position:relative;display:flex;flex-direction:column;gap:3px;padding:14px;border-radius:12px;background:var(--card);box-shadow:var(--card-sh);cursor:pointer;transition:box-shadow var(--std)}
.way .ico{width:18px;height:18px;color:var(--t2);margin-bottom:6px}
.way b{font-size:13px}.way small{font-size:11.5px;line-height:1.45;color:var(--t3)}
.way.on{box-shadow:0 0 0 1.5px var(--fill)}.way.on .ico{color:var(--accent)}
.way.on::after{content:"✓";position:absolute;right:12px;top:10px;font-size:12px;color:var(--accent)}
.use{padding:16px 0}
.use .n{display:flex;align-items:baseline;gap:8px}
.use .n b{font-size:26px;font-weight:600;letter-spacing:-.01em}
.use .n span{color:var(--t2)}.use .n em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--t3)}
.bar{display:flex;gap:2px;height:8px;margin:12px 0 10px;border-radius:4px;overflow:hidden}
.bar i{display:block;transition:flex-grow var(--layout) var(--spring)}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--t2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.about{display:flex;align-items:center;gap:18px;padding:18px 0}
.about img{width:72px;height:72px;border-radius:16px;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 6px 16px rgba(30,28,24,.12)}
.about b{display:block;font-size:20px;font-weight:600}
.about small{font-size:12.5px;color:var(--t2)}
.chk{width:16px;height:16px;border-radius:4px;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--t1) 28%,transparent);cursor:pointer}
.chk.on{background:var(--fill);box-shadow:none}
.chk.on::after{content:"";width:8px;height:4px;border:1.6px solid var(--on-fill);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* 预览：一页书，和第一组顶部对齐，不随内容滚 */
.pv{position:sticky;top:20px;display:flex;flex-direction:column;gap:8px}
.sheet{position:relative;height:340px;overflow:hidden;border-radius:8px;padding:26px var(--mg,22px) 0;background:var(--pb);color:var(--pi);font-family:var(--sf);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05),0 10px 24px rgba(51,46,41,.1);transition:background-color var(--layout),color var(--layout)}
.sheet h4{margin:0 0 12px;text-align:center;font-size:calc(var(--fs) * 1.05);font-weight:600;letter-spacing:.3em}
.sheet p{margin:0;font-size:var(--fs);line-height:var(--lh);text-indent:var(--ind);text-align:var(--ta);transition:font-size var(--std),line-height var(--std)}
.sheet .no{position:absolute;left:0;right:0;bottom:0;padding:34px 0 12px;text-align:center;font:10.5px var(--sans);color:color-mix(in srgb,var(--pi) 55%,transparent);background:linear-gradient(transparent,var(--pb) 55%)}
.sheet .hl{background:var(--hl);border-radius:2px;transition:background-color .25s}
.sheet.en p{font-family:Georgia,serif;font-size:13.5px;line-height:2.5;text-indent:0;text-align:left}
.sheet.en ruby rt{font:9px var(--sans);opacity:.6;transition:opacity .3s}
.sheet.en ruby.off rt{opacity:0}
.pvcap{margin:0 2px;font-size:11.5px;color:var(--t3)}
.player{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 8px;border-radius:20px;background:var(--card);box-shadow:var(--card-sh);font-size:12px}
.player .av{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;background:#B5654A;color:#fff;font-size:11px;font-weight:600}
.player button{margin-left:auto;width:28px;height:28px;border:0;border-radius:14px;background:var(--fill);color:var(--on-fill);cursor:pointer;font-size:10px}
.toast{position:absolute;left:50%;bottom:22px;z-index:9;transform:translate(-50%,10px);opacity:0;display:flex;align-items:center;gap:12px;height:36px;padding:0 8px 0 14px;border-radius:18px;background:var(--t1);color:var(--bg);font-size:12px;transition:opacity var(--std),transform var(--std) var(--spring);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.12s!important;animation:none!important}.tg::after,.seg .th{transition-timing-function:ease-out!important}}
</style></head>
<body>
<div class="top">
  <span class="seg" id="thm"><i class="th"></i><button data-x="light" class="on">浅色</button><button data-x="dark">深色</button></span>
  <span class="seg" id="tnt"><i class="th"></i><button data-x="" class="on">墨蓝</button><button data-x="ink">墨黑</button></span>
</div>
<div class="stage"><div class="win" id="W">
  <div class="lights"><i></i><i></i><i></i></div>
  <nav class="nav"><label class="search"><svg class="ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="m10.2 10.2 3.3 3.3"/></svg><input id="Q" placeholder="搜索设置" autocomplete="off" aria-label="搜索设置"><kbd>⌘F</kbd></label>
    <div class="list" id="L"></div><div class="foot" id="F"></div></nav>
  <div class="res" id="R" hidden></div>
  <main class="paper"><div class="scroll" id="S"></div></main>
  <div class="toast" id="T"></div>
</div></div>
<div class="note">
  <p><b>这一版为什么会舒服一些</b>：正文 13 号、说明 11.5 号，行高 48，组与组之间留 24；内容最宽 600，读起来不会太宽；卡片只用一道细分隔线，不再用边框；导航、标题、第一组和预览从同一条线开始。颜色、圆角、动效都来自 App 的 Tokens.swift。</p>
  <p><b>照规范做了</b>：8 页（播客并进朗读，存储和数据合并，新加关于）；只有阅读、外文、朗读有预览；⌘F 搜每一项、回车跳到那一行并亮一下；改过的页在导航上有小点，页底“这一页改回默认”，导航底部“全部改回”，改回后能撤销；连 Key 在那一行底下展开，不弹窗；同步方式、存储清理、快照都能点。上面可以切浅色/深色、墨蓝/墨黑。</p>
</div>

var IC={book:'<path d="M3 3.5h4.2c.5 0 .8.3.8.8V13c0-.6-.4-1-1-1H3zM13 3.5H8.8c-.5 0-.8.3-.8.8V13c0-.6.4-1 1-1h4z"/>',trans:'<path d="M2.5 4h6M5.5 2.5V4M7.5 4c-.5 2.6-2.2 4.6-4.8 5.6M4.5 6.5c.8 1.4 2 2.4 3.6 3M9 13.5l2.5-6 2.5 6M9.8 11.6h3.4"/>',

var W=document.getElementById('W'),SC=document.getElementById('S'),timer=null;
function nav(){var g='',h='';PG.forEach(function(p){if(p[0]!==g){h+='<p class="gt">'+p[0]+'</p>';g=p[0];}h+='<div class="it'+(p[1]===cur?' on':'')+(changed(p[1])?' ed':'')+'" data-go="'+p[1]+'">'+I(p[3])+'<span>'+p[2]+'</span><i class="dot"></i></div>';});document.getElementById('L').innerHTML=h;
  var n=Object.keys(D).filter(function(k){return S[k]!==D[k]&&OWNER(k);}).length;document.getElementById('F').innerHTML=n?'<span>改了 '+n+' 处</span><a data-resetall>全部改回</a>':'<span>都是默认</span>';}
function OWNER(k){for(var p in OWN)if(OWN[p].indexOf(k)>=0)return p;return null;}
function changed(p){return (OWN[p]||[]).some(function(k){return S[k]!==D[k];});}
function render(o){o=o||{};var top=o.keep?SC.scrollTop:0,p=PAGES[cur];clearInterval(timer);
  SC.innerHTML='<div class="page'+(p.pv?' with':'')+(o.keep?'':' in')+'"><header class="hd"><h1>'+NAME[cur]+'</h1>'+(p.d?'<p>'+p.d+'</p>':'')+'</header><div class="col">'+p.b()+(changed(cur)?'<p class="pgfoot"><a data-resetpage>这一页改回默认</a></p>':'')+'</div>'+(p.pv?PV():'')+'</div>';
  SC.scrollTop=top;nav();thumbs();pvupd();if(cur==='voice')reading();}
function thumbs(){[].forEach.call(document.querySelectorAll('.seg'),function(s){var on=s.querySelector('button.on'),th=s.querySelector('.th');if(!on||!th)return;th.style.width=on.offsetWidth+'px';th.style.transform='translateX('+(on.offsetLeft)+'px)';});}
function pvupd(){var sh=document.getElementById('sh');if(sh)sh.setAttribute('style',SV());
  [].forEach.call(document.querySelectorAll('.sheet.en ruby'),function(r){r.classList.toggle('off',!(S.gloss&&+r.dataset.d>=S.lv+1));});var c=document.getElementById('flcap');if(c)c.textContent=S.gloss?'比'+LV[S.lv]+'难的词，头上写中文。':'现在不标难词。';}
function reading(){var sp=[].slice.call(document.querySelectorAll('#sh [data-ph]')),i=0;function st(){sp.forEach(function(s,j){s.classList.toggle('hl',j===i%sp.length);});i++;}st();timer=setInterval(st,Math.round(1500/S.speed));}
function toast(t,undo){var e=document.getElementById('T');e.innerHTML='<span>'+t+'</span>'+(undo?'<a data-undo>撤销</a>':'');e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on');UNDO=null;},4000);}
function go(p,t){cur=p;render();if(t){var el=SC.querySelector('[data-t="'+t+'"]');if(el){SC.scrollTop=el.offsetTop-SC.clientHeight/2;el.classList.add('flash');}}}

W.addEventListener('click',function(e){var t=e.target,x;
  if(x=t.closest('[data-go]')){if(x.dataset.go!==cur)go(x.dataset.go);return;}
  if(x=t.closest('[data-reset]')){var k=x.dataset.reset,old=S[k];S[k]=D[k];UNDO=[[k,old]];render({keep:1});toast('改回了默认',1);return;}
  if(t.closest('[data-resetpage]')){UNDO=OWN[cur].filter(function(k){return S[k]!==D[k];}).map(function(k){return [k,S[k]];});UNDO.forEach(function(u){S[u[0]]=D[u[0]];});render({keep:1});toast(NAME[cur]+'改回了默认',1);return;}
  if(t.closest('[data-resetall]')){UNDO=Object.keys(D).filter(function(k){return S[k]!==D[k]&&OWNER(k);}).map(function(k){return [k,S[k]];});UNDO.forEach(function(u){S[u[0]]=D[u[0]];});render({keep:1});toast('全部改回了默认（Key 和同步账号不动）',1);return;}
  if(t.closest('[data-undo]')){(UNDO||[]).forEach(function(u){S[u[0]]=u[1];});UNDO=null;document.getElementById('T').classList.remove('on');render({keep:1});return;}
  if(x=t.closest('[data-openkey]')){var o=document.getElementById('o-'+x.dataset.openkey);o.classList.toggle('on');setTimeout(function(){var i=document.getElementById('k-'+x.dataset.openkey);if(i)i.focus();},200);return;}
  if(x=t.closest('[data-paste]')){var id=x.dataset.paste;x.disabled=true;x.innerHTML='<span class="spin" style="display:inline-block;vertical-align:-2px"></span> 核对中';setTimeout(function(){KEY[id]=id==='azure'?'214 个声音 · eastasia':'••••'+'7Qw'.slice(0,3);if(id==='claude')S.ai=1;render({keep:1});toast('连上了');},900);return;}
  if(x=t.closest('[data-unkey]')){KEY[x.dataset.unkey]='';render({keep:1});toast('断开了，Key 已从钥匙串里删掉');return;}
  if(t.closest('[data-test]')){S.tested=S.ai===0?'✓ 这台 Mac 回答了：“你好，我在。”':KEY.claude||KEY.openai?'✓ 连得上，0.8 秒回了一句':'还没填 Key，先在下面连接';render({keep:1});return;}
  if(x=t.closest('[data-way]')){S.icloud=1;S.way=+x.dataset.way;render({keep:1});return;}
  if(t.closest('[data-sync]')){toast('同步好了 · 刚刚');return;}
  if(x=t.closest('[data-clean]')){var k2=x.dataset.clean;S[k2]=1;UNDO=[[k2,0]];render({keep:1});toast('清掉了',1);return;}
  if(t.closest('[data-snap]')){S.snapping=1;render({keep:1});setTimeout(function(){S.snapping=0;render({keep:1});toast('快照生成好了 · 1.2 GB');},1200);return;}
  if(t.closest('[data-up]')){S.up='已经是最新的';render({keep:1});return;}
  if(t.closest('[data-try]')){toast('（原型）念：“从前有一座山，山里有一座庙。”');return;}
  var k=t.closest('[data-k]');if(!k||k.tagName==='INPUT')return;var key=k.dataset.k;
  if(k.classList.contains('tg')||k.classList.contains('chk'))S[key]=S[key]?0:1;else S[key]=+k.dataset.v;render({keep:1});});
W.addEventListener('input',function(e){var el=e.target,k=el.dataset.k;if(!k)return;S[k]=+el.value;el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min)*100)+'%');var o=W.querySelector('[data-o="'+k+'"]');if(o)o.textContent=FMT(el.dataset.f,S[k]);pvupd();});
W.addEventListener('change',function(e){if(e.target.dataset.k)render({keep:1});});

/* 搜索：搜每一项；回车跳到那一行并亮一下 */
var IDX=[];(function(){var keep=cur;PG.forEach(function(p){cur=p[1];LABEL={};PAGES[p[1]].b();Object.keys(LABEL).forEach(function(t){IDX.push([t,p[1]]);});IDX.push([p[2],p[1],1]);});cur=keep;})();
var SYN={'暗':'深色 夜间','黑':'深色 墨黑 黑底','大':'字号','key':'Key 连接 服务商 OpenAI Claude','备份':'快照','声音':'中文 英文 语速','词':'词典 难词 生词'};
var Q=document.getElementById('Q'),RS=document.getElementById('R'),hits=[],sel=0;
function find(){var v=Q.value.trim().toLowerCase();if(!v){RS.hidden=true;return;}var extra=Object.keys(SYN).filter(function(s){return v.indexOf(s)>=0;}).map(function(s){return SYN[s].toLowerCase();}).join(' ');
  hits=IDX.filter(function(x){var t=x[0].toLowerCase();return t.indexOf(v)>=0||extra.split(' ').some(function(w){return w&&t.indexOf(w)>=0;});}).slice(0,8);sel=0;
  RS.innerHTML=hits.length?hits.map(function(x,i){return '<div class="'+(i?'':'on')+'" data-h="'+i+'">'+I(PG.filter(function(p){return p[1]===x[1];})[0][3])+'<span>'+x[0].replace(new RegExp('('+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'),'<mark>$1</mark>')+'</span><em>'+(x[2]?'整页':NAME[x[1]])+'</em></div>';}).join(''):'<p>没有“'+Q.value.replace(/</g,'&lt;')+'”。试试 字号、Key、备份、深色。</p>';RS.hidden=false;}
function pick(i){var x=hits[i];if(!x)return;Q.value='';RS.hidden=true;Q.blur();go(x[1],x[2]?null:x[0]);}
Q.addEventListener('input',find);Q.addEventListener('focus',find);Q.addEventListener('blur',function(){setTimeout(function(){RS.hidden=true;},150);});
Q.addEventListener('keydown',function(e){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(hits.length-1,sel+(e.key==='ArrowDown'?1:-1)));[].forEach.call(RS.children,function(c,j){c.classList.toggle('on',j===sel);});}else if(e.key==='Enter'){e.preventDefault();pick(sel);}else if(e.key==='Escape'){Q.value='';RS.hidden=true;Q.blur();}});
RS.addEventListener('mousedown',function(e){var h=e.target.closest('[data-h]');if(h){e.preventDefault();pick(+h.dataset.h);}});
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='f'){e.preventDefault();Q.focus();Q.select();}
  if((e.metaKey||e.ctrlKey)&&/^[1-9]$/.test(e.key)){var p=PG[+e.key-1];if(p){e.preventDefault();go(p[1]);}}});
/* 上面的浅色/深色、墨蓝/墨黑 */
function topseg(id,attr){var s=document.getElementById(id);s.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(s.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});if(b.dataset.x)document.documentElement.setAttribute(attr,b.dataset.x);else document.documentElement.removeAttribute(attr);thumbs();});}
topseg('thm','data-theme');topseg('tnt','data-tint');
render();
</script>
</body></html>
