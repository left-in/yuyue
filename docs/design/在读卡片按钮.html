<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>语阅 Mac 在读卡片 · 选稿</title>
<style>
/* A review sheet for the 在读 cards: how 接着读 · 听 · 进度 look. Mac drawn 1:1. */
:root {
  --bg: #F6F5F3; --card: #FFFFFF; --inset: #EFEEEB; --line: #E7E5E1;
  --t1: #2A2B2E; --t2: #85827F; --t3: #A8A49F;
  --navy: #2B4C7E; --navy-soft: rgba(43,76,126,.12);
  --ink: #26272A; --on-ink: #FAF8F4;
  --zhu: #B04A32; --zhu-soft: rgba(176,74,50,.10);
  --page: #ECEAE6;
  --serif: 'Songti SC', 'Noto Serif SC', serif; --sans: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
}
:root[data-theme="dark"] {
  --bg: #101112; --card: #1B1C1E; --inset: #26272A; --line: #2C2D30;
  --t1: #EDEDEE; --t2: #9A9895; --t3: #75726E;
  --navy: #8FA8C8; --navy-soft: rgba(143,168,200,.16);
  --ink: #E9E6DF; --on-ink: #161719;
  --zhu: #E2917B; --zhu-soft: rgba(226,145,123,.14);
  --page: #0B0B0C; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--t1); font-family: var(--sans); padding: 28px 16px 80px; }
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px; }
h1 { margin: 0; font-family: var(--serif); font-size: 28px; font-weight: 700; }
.lead { margin: 8px 0 0; color: var(--t2); line-height: 1.75; font-size: 14px; max-width: 74ch; }
.bar { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 12.5px; color: var(--t2); }
.bar button { font: inherit; border: 0; background: var(--card); color: var(--t1); box-shadow: 0 0 0 .5px var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--t1); color: var(--bg); }
.opt { display: flex; flex-direction: column; gap: 14px; }
.opt h2 { margin: 0; font-size: 19px; display: flex; align-items: center; gap: 10px; }
.opt p { margin: 0; font-size: 13.5px; line-height: 1.75; color: var(--t2); max-width: 80ch; }
.opt p b { color: var(--t1); font-weight: 600; }
.tag { font-size: 11.5px; font-weight: 600; color: #fff; background: #26272A; border-radius: 10px; padding: 2px 9px; }
.tag.now { background: var(--t3); }
.stage { background: var(--bg); border-radius: 12px; padding: 20px; box-shadow: 0 0 0 .5px rgba(0,0,0,.08); overflow-x: auto; }
.row { display: grid; grid-template-columns: repeat(3, 264px); gap: 12px; font-size: 12px; align-items: start; }
.zoom { margin-top: 22px; display: flex; gap: 28px; align-items: flex-start; }
.zoom .cc { width: 264px; zoom: 1.7; }
.zoom small { display: block; font-size: 11px; color: var(--t3); margin-bottom: 6px; }

svg.i { width: 12px; height: 12px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.i.f { fill: currentColor; stroke: none; }
.live { animation: w 1.2s ease-in-out infinite; } @keyframes w { 50% { opacity: .4; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; cursor: default; transition: background .15s, transform .1s, filter .15s; }
.btn:active { transform: scale(.96); }

/* shared card bits */
.cc { position: relative; display: flex; gap: 12px; background: var(--card); border-radius: 14px; box-shadow: 0 0 0 .5px var(--line); padding: 12px; min-width: 0; overflow: hidden; }
.cv { width: 44px; height: 66px; border-radius: 2px 4px 4px 2px; flex: none; position: relative; overflow: hidden; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.1); }
.cv::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8%; background: linear-gradient(90deg, rgba(0,0,0,.18), transparent); }
.cv > span { position: absolute; left: 14%; top: 10%; font-family: var(--serif); font-size: 7px; font-weight: 600; color: rgba(30,28,24,.85); }
.cv.dk > span { color: rgba(255,250,235,.85); }
.tx { flex: 1; min-width: 0; }
.tx b { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .m { display: block; font-size: 10.5px; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 现在 */
.o-now .m { margin-bottom: 8px; }
.o-now .pb { height: 3px; border-radius: 2px; background: var(--inset); overflow: hidden; margin-bottom: 10px; } .o-now .pb i { display: block; height: 100%; background: var(--navy); }
.o-now .acts { display: flex; gap: 6px; }
.o-now .btn { height: 26px; padding: 0 12px; border-radius: 999px; background: var(--inset); color: var(--t1); font-size: 11.5px; font-weight: 500; }
.o-now .btn.k { background: var(--navy); color: #fff; } :root[data-theme="dark"] .o-now .btn.k { color: #101214; }
.o-now .btn.l { background: var(--navy-soft); color: var(--navy); }

/* A · 进度就是按钮: the progress line grows into a 32-high bar you press; how far you've read is its fill */
.o-a .cc { flex-direction: column; gap: 11px; }
.o-a .top { display: flex; gap: 12px; align-items: center; }
.o-a .cv { width: 36px; height: 54px; }
.o-a .acts { display: flex; gap: 6px; }
.o-a .track { flex: 1; position: relative; height: 32px; border-radius: 9px; background: var(--inset); overflow: hidden; font-size: 11.5px; font-weight: 600; }
.o-a .track > i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--ink); border-radius: 0 2px 2px 0; }
.o-a .track > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 11px; }
.o-a .track .lo { color: var(--t1); }
.o-a .track em { font-style: normal; font-weight: 500; font-variant-numeric: tabular-nums; opacity: .7; }
.o-a .track:hover { filter: brightness(.97); }
.o-a .sq { width: 32px; height: 32px; border-radius: 9px; background: var(--inset); color: var(--t1); }
.o-a .sq svg { width: 14px; height: 14px; }
.o-a .sq.l { background: var(--zhu-soft); color: var(--zhu); }

/* B · 大圆钮 + 进度环: one big ▶ on the right, ringed by how far you've read; 听 small beneath it */
.o-b .cc { align-items: center; padding-right: 14px; }
.o-b .m { margin-top: 1px; }
.o-b .tx .nx { display: block; margin-top: 9px; font-size: 10.5px; color: var(--t2); }
.o-b .tx .nx i { font-style: normal; color: var(--t3); }
.o-b .side { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
.o-b .ring { position: relative; width: 44px; height: 44px; }
.o-b .ring svg.r { position: absolute; inset: 0; transform: rotate(-90deg); }
.o-b .ring .play { position: absolute; inset: 5px; border-radius: 50%; background: var(--ink); color: var(--on-ink); box-shadow: 0 2px 6px rgba(0,0,0,.18); }
.o-b .ring .play svg { width: 12px; height: 12px; margin-left: 2px; }
.o-b .hp { height: 20px; padding: 0 7px; border-radius: 10px; font-size: 10.5px; color: var(--t2); gap: 3px; }
.o-b .hp svg { width: 11px; height: 11px; }
.o-b .hp:hover { background: var(--inset); color: var(--t1); }
.o-b .hp.l { color: var(--zhu); background: var(--zhu-soft); }

/* C · 封面色: the card takes its cover's colour; frosted white buttons sit on it */
.o-c .cc { background: var(--tint); box-shadow: none; color: var(--fg); }
.o-c .cc::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.10), transparent 60%); pointer-events: none; }
.o-c .cv { box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.o-c .tx b { color: var(--fg); }
.o-c .tx .m { color: var(--fg); opacity: .62; margin-bottom: 8px; }
.o-c .pb { height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--fg) 18%, transparent); overflow: hidden; margin-bottom: 10px; } .o-c .pb i { display: block; height: 100%; background: var(--fg); }
.o-c .acts { display: flex; gap: 6px; position: relative; z-index: 1; }
.o-c .btn { height: 28px; padding: 0 12px 0 10px; border-radius: 8px; font-size: 11.5px; font-weight: 600; }
.o-c .btn.k { background: var(--fg); color: var(--tint); }
.o-c .btn.g { background: color-mix(in srgb, var(--fg) 16%, transparent); color: var(--fg); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

/* D · 书签: a ribbon down the card's right edge; 读 on it in vertical type, 听 tucked under */
.o-d .cc { padding-right: 0; align-items: stretch; }
.o-d .m { margin-bottom: 9px; }
.o-d .pb { height: 2px; border-radius: 1px; background: var(--inset); overflow: hidden; margin-bottom: 9px; margin-right: 12px; } .o-d .pb i { display: block; height: 100%; background: var(--zhu); }
.o-d .nx { display: flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--t2); }
.o-d .nx .hp { margin-left: auto; margin-right: 8px; height: 22px; padding: 0 8px; border-radius: 6px; gap: 4px; color: var(--t2); font-size: 10.5px; }
.o-d .nx .hp:hover { background: var(--inset); color: var(--t1); }
.o-d .nx .hp.l { color: var(--zhu); }
.o-d .rib { flex: none; width: 34px; margin: -12px 0 -12px 0; padding-top: 10px; background: var(--zhu); color: #FFF8F2; flex-direction: column; justify-content: flex-start; gap: 4px; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 9px), 0 100%); }
:root[data-theme="dark"] .o-d .rib { color: #1B1C1E; }
.o-d .rib b { writing-mode: vertical-rl; font-family: var(--serif); font-size: 12.5px; font-weight: 700; letter-spacing: .18em; margin: 0; }
.o-d .rib svg { width: 9px; height: 9px; }
.o-d .rib:hover { filter: brightness(1.08); }

/* E · 封面色 + 进度按钮: the card takes its cover's colour; the progress bar is the button, in that colour */
.o-g .cc, .o-e .cc, .o-f .cc { flex-direction: column; gap: 11px; background: var(--tint); box-shadow: none; color: var(--fg); }
.o-e .cc::after, .o-f .cc::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.12), transparent 60%); pointer-events: none; }
.o-g .top, .o-e .top, .o-f .top { display: flex; gap: 12px; align-items: center; }
.o-g .cv, .o-e .cv, .o-f .cv { width: 36px; height: 54px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.o-g .tx b, .o-e .tx b, .o-f .tx b { color: var(--fg); }
.o-g .tx .m, .o-e .tx .m, .o-f .tx .m { color: var(--fg); opacity: .62; }
.o-g .acts, .o-e .acts, .o-f .acts { display: flex; gap: 6px; position: relative; z-index: 1; }
.o-g .track, .o-e .track, .o-f .track { flex: 1; position: relative; height: 32px; border-radius: 9px; background: color-mix(in srgb, var(--fg) 13%, transparent); overflow: hidden; font-size: 11.5px; font-weight: 600; }
.o-g .track > span, .o-e .track > span, .o-f .track > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 11px; }
.o-g .track em, .o-e .track em, .o-f .track em { font-style: normal; font-weight: 500; font-variant-numeric: tabular-nums; opacity: .7; }
.o-g .track .lo, .o-e .track .lo, .o-f .track .lo { color: var(--fg); }
.o-g .sq, .o-e .sq, .o-f .sq { width: 32px; height: 32px; border-radius: 9px; background: color-mix(in srgb, var(--fg) 13%, transparent); color: var(--fg); }
.o-g .sq svg, .o-e .sq svg, .o-f .sq svg { width: 14px; height: 14px; }
.o-g .sq.l, .o-e .sq.l, .o-f .sq.l { background: var(--fg); color: var(--tint); }
.o-g .track:hover, .o-g .sq:hover, .o-e .track:hover, .o-f .track:hover, .o-e .sq:hover, .o-f .sq:hover { filter: brightness(1.06); }
/* G: the read part is a lighter wash, ended by an upright line where you stopped */
.o-g .track > i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--fg) 16%, transparent); box-shadow: inset -2px 0 0 var(--fg); }
/* E: filled — the read part is solid, and the words over it turn to the card's colour */
.o-e .track > i { position: absolute; inset: 0 auto 0 0; background: var(--fg); }
.o-e .track .hi { color: var(--tint); clip-path: inset(0 calc(100% - var(--p)) 0 0); }
/* F: a line along the bottom edge */
.o-f .track > i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--fg); border-radius: 0 2px 2px 0; }
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.5 2.9v10.2c0 .6.6.9 1.1.6l8-5.1c.5-.3.5-.9 0-1.2l-8-5.1c-.5-.3-1.1 0-1.1.6z"/></symbol>
  <symbol id="i-head" viewBox="0 0 16 16"><path d="M2.8 10V8.2a5.2 5.2 0 0 1 10.4 0V10M2.8 9.6h1.6c.4 0 .7.3.7.7v2.4c0 .4-.3.7-.7.7h-.9a.7.7 0 0 1-.7-.7zM13.2 9.6h-1.6c-.4 0-.7.3-.7.7v2.4c0 .4.3.7.7.7h.9c.4 0 .7-.3.7-.7z"/></symbol>
  <symbol id="i-wave" viewBox="0 0 16 16"><path d="M3 6.5v3M5.5 4.5v7M8 3v10M10.5 5v6M13 6.5v3"/></symbol>
</svg>
<div class="wrap">
  <header>
    <h1>在读卡片 · 封面色 + 进度按钮</h1>
    <p class="lead">上一轮选了「进度就是按钮」和「封面色」，这里把两个合在一起，进度画法给三种：G 是铺浅色、停处一道竖线（你第一眼看到的那版），E 是整根填满、字跟着翻色（进度按钮最早那版），F 是底边一道线。Mac 按原尺寸画，每种先是书架上的一排，下面放大一张，右边是正在听。卡片颜色以后从封面里取。</p>
    <div class="bar">外观 <button data-t="light" aria-pressed="true">浅色</button><button data-t="dark" aria-pressed="false">深色</button></div>
  </header>
  <div id="opts"></div>
</div>
<script>
const I = (id, f, c = '') => `<svg class="i ${f ? 'f' : ''} ${c}"><use href="#i-${id}"/></svg>`;
const books = [
  { t: '背影', a: '朱自清', p: 15, cv: '#F3EFE6', ch: '第 3 段', tint: '#E9E2D2', fg: '#3A3326', tintD: '#3A3428', fgD: '#F1EADB' },
  { t: '紅樓夢', a: 'Xueqin Cao', p: 1, cv: '#E4DEF5', ch: '第一回', tint: '#DCD5F0', fg: '#2F2A4A', tintD: '#2E2A44', fgD: '#E8E3FA' },
  { t: 'Pride and Prejudice', a: 'Jane Austen', p: 31, cv: '#4A3C24', dk: 1, ch: 'Chapter 19', tint: '#4A3C24', fg: '#F4E9D2', tintD: '#3B301D', fgD: '#F4E9D2', l: 1 },
];
const cover = b => `<div class="cv ${b.dk ? 'dk' : ''}" style="background:${b.cv}"><span>${b.t.slice(0, 2)}</span></div>`;
const meta = (b, l) => `<b>${b.t}</b><span class="m">${b.a} · ${b.p}%${l ? ' · 听中' : ''}</span>`;
const opts = [
  { cls: 'o-now', tag: '现在', now: 1, name: '藏青胶囊', text: '标题、进度线，下面挂两颗 26 高的小胶囊。',
    card: (b, l) => `${cover(b)}<div class="tx">${meta(b, l)}<div class="pb"><i style="width:${b.p}%"></i></div><div class="acts"><span class="btn k">接着读</span>${l ? `<span class="btn l">${I('wave', 0, 'live')}听中</span>` : `<span class="btn">听</span>`}</div></div>` },
  { cls: 'o-g', tag: 'G', name: '封面色 + 进度按钮 · 竖线', text: '你第一眼看到的那版：读过的部分<b>铺一层浅一档的颜色，停在哪里就竖一道深色线</b>，像书签夹在那一页。字一直是完整的深色，不翻色。',
    style: (b, dark) => `--tint:${dark ? b.tintD : b.tint};--fg:${dark ? b.fgD : b.fg}`,
    card: (b, l) => `<div class="top">${cover(b)}<div class="tx">${meta(b, l)}</div></div><div class="acts"><span class="btn track"><i style="width:${Math.max(b.p, 3)}%"></i><span class="lo">接着读 · ${b.ch}<em>${b.p}%</em></span></span>${l ? `<span class="btn sq l">${I('wave', 0, 'live')}</span>` : `<span class="btn sq">${I('head')}</span>`}</div>` },
  { cls: 'o-e', tag: 'E', name: '封面色 + 进度按钮 · 填满', text: '<b>C 的封面色 + A 的进度按钮</b>。整张卡染成封面的颜色，按钮是同色系浅一档的一根长条，<b>读了多少就被深色填满多少</b>，被填到的那段字翻成卡片的底色，像进度条把字「吃」进去。这是 A 最早那一版的填法。',
    style: (b, dark) => `--tint:${dark ? b.tintD : b.tint};--fg:${dark ? b.fgD : b.fg}`,
    card: (b, l) => `<div class="top">${cover(b)}<div class="tx">${meta(b, l)}</div></div><div class="acts"><span class="btn track" style="--p:${Math.max(b.p, 3)}%"><i style="width:${Math.max(b.p, 3)}%"></i><span class="lo">接着读 · ${b.ch}<em>${b.p}%</em></span><span class="hi">接着读 · ${b.ch}<em>${b.p}%</em></span></span>${l ? `<span class="btn sq l">${I('wave', 0, 'live')}</span>` : `<span class="btn sq">${I('head')}</span>`}</div>` },
  { cls: 'o-f', tag: 'F', name: '封面色 + 进度按钮 · 底线', text: '同样是封面色 + 进度按钮，进度换成<b>按钮底边一道深色线</b>，字永远不被切开。更安静。',
    style: (b, dark) => `--tint:${dark ? b.tintD : b.tint};--fg:${dark ? b.fgD : b.fg}`,
    card: (b, l) => `<div class="top">${cover(b)}<div class="tx">${meta(b, l)}</div></div><div class="acts"><span class="btn track"><i style="width:${Math.max(b.p, 3)}%"></i><span class="lo">接着读 · ${b.ch}<em>${b.p}%</em></span></span>${l ? `<span class="btn sq l">${I('wave', 0, 'live')}</span>` : `<span class="btn sq">${I('head')}</span>`}</div>` },
];
function render() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const card = (o, b, l = b.l) => `<div class="cc" style="${o.style ? o.style(b, dark) : ''}">${o.card(b, l)}</div>`;
  document.getElementById('opts').innerHTML = opts.map(o => `
    <section class="opt ${o.cls}">
      <h2><span class="tag ${o.now ? 'now' : ''}">${o.tag}</span>${o.name}</h2>
      <p>${o.text}</p>
      <div class="stage">
        <div class="row">${books.map(b => card(o, b)).join('')}</div>
        <div class="zoom"><div><small>放大</small>${card(o, books[0], 0)}</div><div><small>正在听</small>${card(o, books[0], 1)}</div></div>
      </div>
    </section>`).join('');
}
render();
document.querySelectorAll('.bar button').forEach(b => b.onclick = () => {
  document.documentElement.dataset.theme = b.dataset.t;
  document.querySelectorAll('.bar button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
</script>
</body></html>
