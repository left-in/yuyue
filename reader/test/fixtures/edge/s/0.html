<main id="yy-content" class="yy-section" data-section="0"> <h2 id="ch1"><span class="s" data-s="0">第一章　标点和注音</span></h2><div class="yy-meta">读 1 分钟 · 听 1 分钟</div> <p><span class="s" data-s="1">他说<span class="pz-r">：</span>“我买几个橘子去。</span><span class="s" data-s="2">你就在此地，不要走动<span class="pz-r">。</span>”</span><span class="s" data-s="3">我看那边月台的栅栏外有几个卖东西的等着顾客。</span></p> <p><span class="s" data-s="4">这本书叫《<span class="pz-l">“</span>红楼”梦<span class="pz-r">》</span>（又名《石头记<span class="pz-r">》</span><span class="pz-r">）</span>。</span><span class="s" data-s="5">真的吗<span class="pz-r">？</span>！</span><span class="s" data-s="6">是的……</span></p> <p><ruby><span class="s" data-s="7">背</span><rp>(</rp><rt>bèi</rt><rp>)</rp></ruby><span class="s" data-s="7">影是一篇散文。</span></p> <p><span class="s" data-s="8">这是一个注释</span><a epub:type="noteref" href="#" data-yy-target="0#fn1" class="yy-noteref">1</a><span class="s" data-s="8">。</span><span class="s" data-s="9">注释后面还有一句。</span></p> <p><span class="s" data-s="10">前半句</span><em><span class="s" data-s="10">强调的部分。</span><span class="s" data-s="11">后面</span></em><span class="s" data-s="11">接着说完。</span></p> <p><span class="s" data-s="12">我们过了江，进了车站。</span><span class="s" data-s="13">我买票，他忙着照看行李。</span></p> <p><span class="s" data-s="14">点我。</span></p>  <p><a href="#" data-yy-target="1#part2"><span class="s" data-s="15">跳到第二部分</span></a><span class="s" data-s="15">，或者看</span><a href="#" data-yy-external="https://example.com/"><span class="s" data-s="15">外部链接</span></a><span class="s" data-s="15">。</span></p> <p class="pic"><img src="../r/OEBPS/images/dot.png" alt="点"></p> <p><span class="s" data-s="16">他一面走，一面想，想到家里的光景，想到父亲的差使，想到祖母的丧事，想到自己将要远行，</span><span class="s" data-s="17">想到这一路上的种种，想到许多说不出的心事，心里便觉得沉甸甸的，脚下也越走越慢了。</span></p> <aside epub:type="footnote" id="fn1" class="yy-footnote"><p>注释的内容。</p></aside> </main>
