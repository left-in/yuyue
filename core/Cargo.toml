[workspace]
resolver = "3"
members = ["yuyue-core", "uniffi-bindgen", "yuyue-cli"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

[profile.dev]
# Keep target/ small: disk on the dev machine is tight.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
